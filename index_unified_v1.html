<style>:root{
  --bg:#05070b;
  --p-bg:linear-gradient(180deg,#111820 0%,#0b1016 52%,#070a0e 100%);
  --panel:#10151c;
  --panel2:#171e27;
  --panel3:#202a35;
  --b-col:#394552;
  --acc:#ff2638;
  --acc2:#ff5967;
  --acc-glow:rgba(255,38,56,.42);
  --t-col:#ffd54a;
  --green:#39e879;
  --blue:#35b8ff;
  --txt:#f5f7fa;
  --sub:#8995a4;
  --btn:linear-gradient(180deg,#202a35,#12181f);
  --steel:linear-gradient(180deg,#252f39,#12181f);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Arial,system-ui,sans-serif;transition:background .25s,color .25s}
body{padding:0;display:flex;justify-content:center;align-items:center;position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
.portal{
  width:100%;height:100%;max-width:420px;max-height:100vh;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;gap:7px;padding:8px 10px 7px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(50,63,76,.55) 0%,rgba(17,23,30,.18) 34%,transparent 58%),
    var(--p-bg);
  border:0;border-radius:0;box-shadow:inset 0 0 90px rgba(0,0,0,.42);
  text-align:center;
}
.portal:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px}
.portal:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px rgba(0,0,0,.5)}
.portal>*{position:relative;z-index:1}
.top-bar{display:flex;justify-content:flex-end;gap:5px;height:32px;flex:none;border-bottom:1px solid #252e38;padding-bottom:5px}
.top-btn{min-width:64px;height:27px;padding:0 8px;background:var(--steel);border:1px solid var(--b-col);color:var(--txt);border-radius:5px;font-size:8px;font-weight:950;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.09),0 4px 10px rgba(0,0,0,.35)}
.top-btn:active{transform:scale(.96);border-color:var(--acc2)}
.logo-container{display:flex;flex-direction:column;align-items:center;gap:2px;margin:2px 0 3px;padding-bottom:5px;border-bottom:1px solid #252e38}
.logo-icon{width:44px;height:44px;background:radial-gradient(circle at 35% 30%,#ff5967 0%,#ff2638 48%,#8d101d 100%);border:2px solid #f5f7fa;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:18px;box-shadow:0 0 18px var(--acc-glow),0 5px 12px rgba(0,0,0,.45)}
.publisher-logo{
  display:flex;
  align-items:baseline;
  justify-content:center;
  margin:0;
  font-size:19px;
  line-height:1;
  font-weight:1000;
  letter-spacing:-.7px;
  text-transform:none;
  text-shadow:0 2px 4px #000,0 0 12px rgba(255,255,255,.08);
}
.publisher-free{color:#f5f7fa}
.publisher-zzz{
  color:#ff3348;
  text-shadow:0 0 10px rgba(255,38,56,.32),0 2px 4px #000;
}
.publisher-games{
  color:#aeb6bf;
  font-size:.72em;
  letter-spacing:-.3px;
  margin-left:1px;
}
.game-brand-mark{
  width:42px;
  height:30px;
  margin:1px 0 1px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border:1px solid #8b949d;
  border-radius:7px;
  background:linear-gradient(180deg,#59636d,#252c33);
  box-shadow:inset 0 1px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.55);
}
.game-brand-mark:before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:4px;
}
.brand-screen{
  position:relative;
  z-index:1;
  color:#ff4656;
  font-size:15px;
  line-height:1;
  text-shadow:0 1px 3px #000,0 0 7px rgba(255,38,56,.35);
}

.game-title{font-size:18px;font-weight:1000;color:var(--txt);text-shadow:0 2px 10px #000;letter-spacing:1px;margin:0}.game-title .empire-word{color:var(--acc)}
.game-subtitle{font-size:7px;color:var(--sub);text-transform:uppercase;letter-spacing:1.8px;margin:0}
.profile-card{background:linear-gradient(180deg,rgba(23,30,39,.96),rgba(13,18,24,.98));border:1px solid var(--b-col);border-left:4px solid var(--acc);border-radius:7px;padding:9px 10px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:inset 0 1px rgba(255,255,255,.06),0 6px 14px rgba(0,0,0,.35)}
.avatar-box{width:43px;height:43px;background:linear-gradient(180deg,#202a35,#11171d);border:1px solid #4b5864;border-radius:5px;display:flex;justify-content:center;align-items:center;font-size:21px;flex-shrink:0;overflow:hidden;box-shadow:inset 0 1px #fff1}
.profile-info{display:flex;flex-direction:column;gap:3px;overflow:hidden}.profile-name{font-size:11px;font-weight:950;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-stats{font-size:8px;color:var(--sub)}
.chat-widget{background:linear-gradient(180deg,rgba(20,27,35,.96),rgba(12,17,23,.98));border:1px solid #3d4853;border-radius:7px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;max-height:74px;overflow:hidden;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.05),0 5px 12px rgba(0,0,0,.3)}
.chat-widget:hover{border-color:var(--acc)}.chat-title{font-size:8px;color:var(--t-col);font-weight:950;text-transform:uppercase;display:flex;justify-content:space-between;letter-spacing:.4px}.chat-messages{font-size:8px;color:var(--sub);display:flex;flex-direction:column;gap:2px;overflow-y:auto}.chat-messages b{color:var(--txt)}
.menu-nav{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto;gap:7px;margin:6px 0 0}
.menu-btn{background:linear-gradient(180deg,#202a34,#11171e);border:1px solid #4c5965;border-radius:6px;padding:9px 10px;color:var(--txt);font-size:10px;font-weight:950;text-decoration:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.07),0 5px 12px rgba(0,0,0,.32);transition:transform .1s,border-color .1s,box-shadow .1s}
.menu-btn:hover{border-color:#62717e}.menu-btn:active{transform:scale(.975);border-color:var(--acc);box-shadow:0 0 10px var(--acc-glow)}
.menu-nav .studio-tile{grid-column:1 / -1;min-height:68px;justify-content:center;gap:10px;font-size:13px;background:linear-gradient(180deg,#ff3348,#d91f32);border:1px solid #ff6575;box-shadow:inset 0 1px rgba(255,255,255,.22),0 0 18px rgba(255,38,56,.25),0 7px 16px rgba(0,0,0,.35);text-shadow:0 1px 2px #7a101b}.menu-nav .studio-tile span:last-child{font-size:18px}.menu-nav .small-tile{min-height:61px;justify-content:center;padding:7px 5px;font-size:8.5px;text-align:center;flex-direction:column;gap:5px}.menu-nav .small-tile span:last-child{display:block;font-size:17px}.menu-nav .small-tile:nth-child(2){border-top:2px solid var(--blue)}.menu-nav .small-tile:nth-child(3){border-top:2px solid var(--green)}.menu-nav .small-tile:nth-child(4){border-top:2px solid var(--t-col)}
.footer-info{margin-top:auto;font-size:7px;color:var(--sub);opacity:.78;padding-top:6px;border-top:1px solid #252e38}
.modal-overlay{position:absolute;inset:0;background:rgba(3,6,9,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}.modal-overlay.active{opacity:1;pointer-events:auto}.modal-content{background:linear-gradient(180deg,#18212a,#0c1117);border:1px solid var(--b-col);border-top:2px solid var(--acc);border-radius:8px;padding:14px;text-align:center;width:100%;max-width:300px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.modal-input{width:100%;background:#0b1015;border:1px solid #46535f;border-radius:5px;padding:8px;color:#fff;font-family:monospace;font-size:11px;outline:none;text-align:center}.modal-input::placeholder{color:var(--sub)}
</style>

        <small>TUBE EMPIRE · STREAMER PROFILE</small>
      </div>
    </div>
    <div class="business-card-stats">
      <div class="business-stat money">
        <div class="business-stat-label" id="businessBalanceLabel">Баланс</div>
        <div class="business-stat-value" id="businessBalance">0.00 🪙</div>
      </div>
      <div class="business-stat">
        <div class="business-stat-label">STATUS</div>
        <div class="business-stat-value">ONLINE</div>
      </div>
    </div>
    <button class="business-card-close" onclick="closeBusinessCard()" id="businessCloseBtn">ЗАКРЫТЬ</button>
  </div>
</div>

<!-- Модальные окна -->
<div class="modal-overlay" id="chatModal" onclick="closeChatModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div style="font-size:12px;font-weight:800;color:var(--t-col);" id="chatModalTitle">💬 ГЛОБАЛЬНЫЙ ЧАТ</div>
    <div id="fullChatFeed" style="background:rgba(0,0,0,0.4);border:1px solid var(--b-col);border-radius:8px;padding:6px;height:120px;overflow-y:auto;text-align:left;font-size:8px;color:var(--sub);"></div>
    <div style="display:flex;gap:4px;">
      <input type="text" id="chatInputMsg" class="modal-input" placeholder="Сообщение...">
      <button class="menu-btn primary" style="padding:6px 10px;" onclick="sendChatMessage()">💬</button>
    </div>
    <button class="top-btn" style="width:100%;padding:6px;" onclick="closeChatModal()" id="chatCloseBtn">ЗАКРЫТЬ</button>
  </div>
</div>


<script>
const langMap = {
  ru: { sub: "Idle Streamer Tycoon", studio: "🔴 ВОЙТИ В СТУДИЮ", avatar: "🎨 Кастомизация", arcade: "🕹️ Аркада", rank: "📊 Таблица Лидеров", balance: "Баланс", chatTitle: "💬 Глобальный чат (онлайн)", chatModal: "💬 ГЛОБАЛЬНЫЙ ЧАТ", placeholder: "Сообщение...", close: "ЗАКРЫТЬ", soundOn: "🔊 ЗВУК", soundOff: "🔇 ВЫКЛ", footer: "Tube Empire v5.8 • Telegram Mini App", demoAlex: "Кто на каком тренде сейчас?", demoLeader: "Качайте канал!" },
  de: { sub: "Idle Streamer Tycoon", studio: "🔴 INS STUDIO", avatar: "🎨 Anpassung", arcade: "🕹️ Arcade", rank: "📊 Bestenliste", balance: "Guthaben", chatTitle: "💬 Globaler Chat (Online)", chatModal: "💬 GLOBALER CHAT", placeholder: "Nachricht...", close: "SCHLIESSEN", soundOn: "🔊 TON", soundOff: "🔇 AUS", footer: "Tube Empire v5.8 • Telegram Mini App", demoAlex: "Wer ist gerade auf welchem Trend?", demoLeader: "Kanal ausbauen!" },
  en: { sub: "Idle Streamer Tycoon", studio: "🔴 ENTER STUDIO", avatar: "🎨 Customization", arcade: "🕹️ Arcade", rank: "📊 Leaderboard", balance: "Balance", chatTitle: "💬 Global Chat (Online)", chatModal: "💬 GLOBAL CHAT", placeholder: "Message...", close: "CLOSE", soundOn: "🔊 SOUND", soundOff: "🔇 OFF", footer: "Tube Empire v5.8 • Telegram Mini App", demoAlex: "Who is riding which trend?", demoLeader: "Grow the channel!" }
};

const CHAT_KEY='tube_empire_geek_chat_v2';
const CHAT_MAX=100;
const geekBots=[
  {user:'Alex',lines:['Кто-нибудь ещё помнит LAN-вечеринки?','Я сегодня ковырял старый JavaScript-код. Ностальгия 😎','CSS опять победил меня с одного margin.','Какой ваш любимый ретро-жанр?']},
  {user:'APTB_Leader',lines:['Только что собирал маленький HTML-интерфейс без фреймворков.','Flexbox спасает мир уже который год.','Я за механические клавиатуры и тёмные темы.','Кстати, кто ещё любит старые CRT-мониторы?']},
  {user:'ByteBot',lines:['Git commit: исправил баг, создал два новых. Классика.','Сегодня тема дня — оптимизация без преждевременной оптимизации.','Linux, терминал и кофе — неплохой стек.','Игры на JavaScript становятся всё интереснее.']}
];
let chatMessagesData=[];
let chatBotTimer=null;
function loadChat(){
  try{chatMessagesData=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');if(!Array.isArray(chatMessagesData))chatMessagesData=[];}catch(e){chatMessagesData=[]}
  if(!chatMessagesData.length){
    chatMessagesData=[
      {user:'Alex',text:'Кто-нибудь ещё помнит LAN-вечеринки?',bot:true},
      {user:'APTB_Leader',text:'Я за механические клавиатуры и тёмные темы.',bot:true},
      {user:'ByteBot',text:'Git commit: исправил баг, создал два новых. Классика.',bot:true}
    ]; saveChat();
  }
}
function saveChat(){
  try{chatMessagesData=chatMessagesData.slice(-CHAT_MAX);localStorage.setItem(CHAT_KEY,JSON.stringify(chatMessagesData));}catch(e){}
}
function escapeChat(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addChatMessage(user,text,bot=false){
  if(!String(text).trim())return;
  chatMessagesData.push({user:String(user),text:String(text).trim(),bot:!!bot});saveChat();renderChatFeeds();
}
function botSpeak(){
  const bot=geekBots[Math.floor(Math.random()*geekBots.length)];
  const text=bot.lines[Math.floor(Math.random()*bot.lines.length)];
  addChatMessage(bot.user,text,true);
}
function startGeekChat(){
  loadChat();
  if(chatBotTimer)clearInterval(chatBotTimer);
  chatBotTimer=setInterval(botSpeak,9000);
}
function playButtonSound(){
  try { Core.playSound('click'); } catch(e) {}
}

function toggleSoundUI(){
  try {
    const wasOn = Core.getSound();
    const next = Core.toggleSound();
    updateUI();
    // When enabling sound, give immediate confirmation; when disabling, remain silent.
    if(!wasOn && next) Core.playSound('modal');
  } catch(e) {}
}

function syncDemoChat(t){}

function updateUI() {
  let lang = Core.getLang(), t = langMap[lang] || langMap.ru;
  syncDemoChat(t);
  document.getElementById('subTitle').textContent = t.sub;
  document.getElementById('btnStudio').textContent = t.studio;
  document.getElementById('btnAvatar').textContent = t.avatar;
  if(document.getElementById('btnArcade')) document.getElementById('btnArcade').textContent = t.arcade || "🕹️ Arcade";
  document.getElementById('btnRank').textContent = t.rank;
  document.getElementById('chatHeaderTxt').textContent = t.chatTitle;
  document.getElementById('chatModalTitle').textContent = t.chatModal;
  document.getElementById('chatInputMsg').placeholder = t.placeholder;
  document.getElementById('chatCloseBtn').textContent = t.close;
  document.getElementById('soundBtn').textContent = Core.getSound() ? t.soundOn : t.soundOff;
  document.querySelector('.footer-info').textContent = t.footer;

  document.getElementById('langBtn').textContent = lang === 'ru' ? '🇷🇺 RU' : (lang === 'de' ? '🇩🇪 DE' : '🇬🇧 EN');

  const userName=Core.getUserName("Блогер");
  const money=Core.getMoney();
  const moneyTheme=Core.getMoneyColor?.()||{color:'#f5f7fa'};
  const studioTheme=Core.getStudioButtonColor?.()||{color:'#ff3348'};
  const pet=Core.getPet?.()||{icon:'🐱'};
  const channelAvatar=Core.getChannelAvatar?.()||{icon:'▶️'};
  document.getElementById('userName').textContent=userName;
  document.getElementById('userStats').innerHTML=`${t.balance}: <span id="mainMoneyValue">${money.toLocaleString('ru-RU',{maximumFractionDigits:2})} 🪙</span>`;
  document.getElementById('mainMoneyValue').style.color=moneyTheme.color;
  document.getElementById('userName').style.color=moneyTheme.color;
  document.getElementById('avatarDisplay').textContent=Core.getAvatarString();
  document.getElementById('petDisplay').textContent=pet.icon||'';
  document.getElementById('channelAvatarDisplay').textContent=channelAvatar.icon||'';
  const studio=document.getElementById('btnStudio');
  if(studio)studio.parentElement.style.background=`linear-gradient(180deg,${studioTheme.color},${studioTheme.color}cc)`;
  renderChatFeeds();
}

function renderChatFeeds() {
  let html = chatMessagesData.map(m => `<span><b>${m.user}:</b> ${m.text}</span>`).join('');
  document.getElementById('chatWidgetFeed').innerHTML = html;
  let f = document.getElementById('fullChatFeed'); if(f) { f.innerHTML = html; f.scrollTop = f.scrollHeight; }
  const w = document.getElementById('chatWidgetFeed'); if(w) w.scrollTop = w.scrollHeight;
}


function openBusinessCard() {
  const modal = document.getElementById('businessCardModal');
  if(!modal) return;
  const lang = Core.getLang(), t = langMap[lang] || langMap.ru;
  const moneyTheme=Core.getMoneyColor?.()||{color:'#f5f7fa'};
  document.getElementById('businessName').textContent=Core.getUserName("Блогер");
  document.getElementById('businessName').style.color=moneyTheme.color;
  document.getElementById('businessAvatar').textContent=Core.getAvatarString();
  document.getElementById('businessBalance').textContent=`${Core.getMoney().toLocaleString('ru-RU',{maximumFractionDigits:2})} 🪙`;
  document.getElementById('businessBalance').style.color=moneyTheme.color;
  document.getElementById('businessBalanceLabel').textContent = t.balance;
  document.getElementById('businessCloseBtn').textContent = t.close;
  modal.classList.add('active');
  try { Core.playSound('modal'); } catch(e) {}
}
function closeBusinessCard() {
  const modal = document.getElementById('businessCardModal');
  if(modal) modal.classList.remove('active');
}

function openChatModal() { document.getElementById('chatModal').classList.add('active'); Core.playSound('modal'); }
function closeChatModal() { document.getElementById('chatModal').classList.remove('active'); }
function sendChatMessage() {
  let inp = document.getElementById('chatInputMsg'), txt = inp.value.trim();
  if(!txt) return;
  addChatMessage(Core.getUserName("Streamer"),txt,false);
  inp.value=""; Core.playSound('click');
}


document.addEventListener('pointerdown', e => {
  const el = e.target.closest('button, a, input[type="button"], input[type="submit"]');
  if(!el || el.disabled) return;
  if(el.id === 'soundBtn') return;
  playButtonSound();
}, {passive:true});

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = document.activeElement;
  if(!el || !el.matches('button, a, input[type="button"], input[type="submit"]')) return;
  if(el.id === 'soundBtn') return;
  playButtonSound();
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='chatInputMsg'){e.preventDefault();sendChatMessage();}});
document.addEventListener('DOMContentLoaded',()=>{loadChat();startGeekChat();updateUI();});
window.addEventListener('tubeEmpireChange',()=>updateUI());

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = document.activeElement;
  if(el && el.classList.contains('profile-card')) {
    e.preventDefault();
    openBusinessCard();
  }
  if(e.key === 'Escape') closeBusinessCard();
});

</script>
