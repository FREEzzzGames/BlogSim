services:
  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/earthdeck
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    ports: ["8080:8080"]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: earthdeck, POSTGRES_USER: earthdeck, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3000:3000"]
volumes: {pgdata: {}}
