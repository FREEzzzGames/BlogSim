<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Кастомизация</title>
<script src="core.js"></script>
<link rel="stylesheet" href="tube-theme.css">
<style>
:root{
  --bg:#0b1015;
  --panel:#151c23;
  --panel2:#10161c;
  --line:#3d4853;
  --line2:#56636f;
  --red:#ff3348;
  --red2:#d91f32;
  --text:#f3f5f7;
  --muted:#8e9aa5;
  --gold:#ffc928;
  --green:#43d17b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0d;color:var(--text);font-family:monospace}
body{display:flex;justify-content:center;align-items:center}
button{font:inherit}
.portal{
  width:100%;height:100%;max-width:420px;
  padding:8px 10px 7px;
  display:flex;flex-direction:column;gap:7px;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(55,68,82,.42),transparent 48%),
    linear-gradient(180deg,#151c23,#0b1015);
  position:relative;
  overflow:hidden;
}
.portal:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:34px 34px;
}
.portal>*{position:relative;z-index:1}

.topbar{
  height:32px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #29323b;padding-bottom:5px;flex:none;
}
.back{
  width:32px;height:27px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#27323c,#151c23);
  border:1px solid var(--line);border-radius:5px;color:#fff;text-decoration:none;
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 4px 9px #0008;
  font-size:15px;
}
.back:active{transform:scale(.96);border-color:var(--red)}
.header-title{font-size:11px;font-weight:1000;letter-spacing:.7px}
.header-code{font-size:7px;color:#71808c;letter-spacing:.6px}

.titlebar{
  display:flex;align-items:center;justify-content:space-between;
  min-height:30px;padding:0 9px;
  background:linear-gradient(180deg,#202a34,#12181e);
  border:1px solid var(--line);border-radius:6px;
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 5px 12px #0006;
}
.titlebar b{font-size:9px;color:#dce2e7;letter-spacing:.5px}
.status{font-size:7px;color:var(--green);font-weight:900}
.status:before{content:"●";margin-right:4px}

.preview{
  flex:none;height:154px;
  display:grid;grid-template-columns:1fr 108px 1fr;gap:8px;
  align-items:center;padding:8px;
  background:linear-gradient(180deg,#1b242d,#10161c);
  border:1px solid var(--line);border-radius:7px;
  box-shadow:inset 0 1px rgba(255,255,255,.06),0 7px 15px #0008;
}
.side-stat{
  height:100%;display:flex;flex-direction:column;justify-content:center;gap:6px;
  text-align:left;
}
.side-stat.right{text-align:right}
.side-label{font-size:7px;color:#687682;text-transform:uppercase;letter-spacing:.5px}
.side-value{font-size:9px;font-weight:900;color:#dfe5e9}
.preview-screen{
  width:108px;height:128px;
  border:2px solid #65727d;border-radius:6px;
  background:
    radial-gradient(circle at 50% 32%,rgba(255,51,72,.18),transparent 36%),
    linear-gradient(180deg,#202a34,#0b1015);
  box-shadow:inset 0 0 22px #000,0 0 14px rgba(255,51,72,.12);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.preview-screen:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px);
}
/* Компактный пятислойный предпросмотр: каждый слой соответствует одному пункту выбора. */
.avatar-preview{
  position:relative;
  width:92px;
  height:112px;
  overflow:hidden;
  border-radius:4px;
}
.avatar-layer{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  line-height:1;
  white-space:nowrap;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.8));
  pointer-events:none;
}
.avatar-gender{
  top:7px;
  font-size:34px;
  z-index:1;
}
.avatar-head{
  top:3px;
  font-size:22px;
  z-index:3;
}
.avatar-torso{
  top:48px;
  font-size:35px;
  z-index:2;
}
.avatar-legs{
  top:76px;
  font-size:28px;
  z-index:1;
}
.avatar-accessory{
  left:auto;
  right:5px;
  transform:none;
  top:51px;
  font-size:19px;
  z-index:5;
}

.preview-caption{
  position:absolute;left:0;right:0;bottom:5px;text-align:center;
  font-size:6px;color:#75828d;letter-spacing:1px;z-index:2;
}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.tab{
  height:32px;background:linear-gradient(180deg,#202a34,#12181e);
  border:1px solid var(--line);border-radius:6px;color:#bfc7ce;
  font-size:8px;font-weight:950;cursor:pointer;
}
.tab.active{
  background:linear-gradient(180deg,#ff394d,#d91f32);
  border-color:#ff6575;color:#fff;
  box-shadow:0 0 12px rgba(255,51,72,.18),inset 0 1px #ffffff38;
}

.section{
  min-height:0;flex:1;overflow-y:auto;padding-right:1px;
  scrollbar-width:thin;scrollbar-color:#45515c transparent;
}
.section::-webkit-scrollbar{width:4px}
.section::-webkit-scrollbar-thumb{background:#45515c;border-radius:4px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{
  min-height:62px;padding:7px;
  background:linear-gradient(180deg,#1b242d,#11171d);
  border:1px solid var(--line);border-radius:6px;
  box-shadow:inset 0 1px rgba(255,255,255,.045),0 4px 9px #0007;
  display:flex;flex-direction:column;justify-content:space-between;
}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:4px}
.card-name{font-size:7px;color:#aeb8c0;font-weight:900;text-transform:uppercase;letter-spacing:.35px}
.card-val{font-size:18px;text-align:center;line-height:22px;margin:2px 0}
.option-name{height:9px;text-align:center;color:#77838e;font-size:6px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.option-price{height:8px;text-align:center;color:#49d17d;font-size:6px;font-weight:900}
.controls{display:grid;grid-template-columns:28px 1fr 28px;gap:4px}
.ctrl{
  height:23px;background:linear-gradient(180deg,#27323c,#171e25);
  border:1px solid #4b5864;border-radius:4px;color:#fff;font-size:11px;
  font-weight:900;cursor:pointer;
}
.ctrl:active{transform:scale(.95);border-color:var(--red);background:#2a2024}
.option-index{font-size:6px;color:#65727d;text-align:center;align-self:center}

.studio-section{display:none}
.studio-card{
  padding:8px;background:linear-gradient(180deg,#1b242d,#11171d);
  border:1px solid var(--line);border-radius:6px;
  display:grid;grid-template-columns:1fr 96px 1fr;gap:7px;align-items:center;
  margin-bottom:6px;
}
.studio-card .card-val{font-size:20px}
.studio-name{font-size:7px;color:#aeb8c0;font-weight:900;text-transform:uppercase}
.studio-card .controls{grid-column:1 / 4}

.save{
  flex:none;height:36px;border:1px solid #ff6575;border-radius:6px;
  background:linear-gradient(180deg,#ff394d,#d91f32);color:#fff;
  font-size:9px;font-weight:1000;letter-spacing:.4px;cursor:pointer;
  box-shadow:inset 0 1px rgba(255,255,255,.2),0 7px 15px #0008;
}
.save:active{transform:scale(.985)}
.footer{font-size:6px;color:#596671;text-align:center;flex:none;letter-spacing:.4px}

@media(max-height:620px){
  .preview{height:132px}.preview-screen{height:108px}
  .preview{grid-template-columns:1fr 92px 1fr}.preview-screen{width:92px}
  .card{min-height:56px}.card-val{font-size:16px}
}
</style>
</head>
<body>
<div class="portal">

  <div class="topbar">
    <a href="index.html" class="back" aria-label="Меню">⌂</a>
    <div class="header-title" id="headerTitle">КАСТОМИЗАЦИЯ</div>
    <div class="header-code">STYLE CONFIG // 01</div>
  </div>

  <div class="titlebar">
    <b id="modeTitle">AVATAR LOADOUT</b>
    <span class="status">READY</span>
  </div>

  <div class="preview">
    <div class="side-stat">
      <div class="side-label">PROFILE</div>
      <div class="side-value" id="profileName">BLOGGER</div>
      <div class="side-label">TYPE</div>
      <div class="side-value">CREATOR</div>
    </div>
    <div class="preview-screen" id="previewScreen">
      <div class="avatar-preview" id="characterPreview">
        <div class="avatar-layer avatar-gender" id="previewGender">👦</div>
        <div class="avatar-layer avatar-head" id="previewHead">👤</div>
        <div class="avatar-layer avatar-torso" id="previewTorso">👕</div>
        <div class="avatar-layer avatar-legs" id="previewLegs">👖</div>
        <div class="avatar-layer avatar-accessory" id="previewAccessory"></div>
      </div>
      <div class="preview-caption">LIVE PREVIEW</div>
    </div>
    <div class="side-stat right">
      <div class="side-label">SLOT</div>
      <div class="side-value">CUSTOM 01</div>
      <div class="side-label">STATUS</div>
      <div class="side-value" style="color:var(--green)">ACTIVE</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabAvatar" onclick="switchTab('avatar')">👤 АВАТАР БЛОГЕРА</button>
    <button class="tab" id="tabStudio" onclick="switchTab('studio')">🏢 СТУДИЯ / ИНТЕРЬЕР</button>
  </div>

  <div class="section" id="avatarSection">
    <div class="grid">
      <div class="card" id="cardGender">
        <div class="card-head"><span class="card-name">Gender</span><span class="option-index" id="idxGender"></span></div>
        <div class="card-val" id="valGender">👦</div><div class="option-name" id="nameGender"></div><div class="option-price" id="priceGender"></div>
        <div class="controls"><button class="ctrl" onclick="changeAvatar('gender',-1)">◀</button><span></span><button class="ctrl" id="buyGender" onclick="buyCurrentAvatar('gender')">▶</button></div>
      </div>
      <div class="card" id="cardHead">
        <div class="card-head"><span class="card-name">Headwear</span><span class="option-index" id="idxHead"></span></div>
        <div class="card-val" id="valHead">👤</div><div class="option-name" id="nameHead"></div><div class="option-price" id="priceHead"></div>
        <div class="controls"><button class="ctrl" onclick="changeAvatar('head',-1)">◀</button><span></span><button class="ctrl" id="buyHead" onclick="buyCurrentAvatar('head')">▶</button></div>
      </div>
      <div class="card" id="cardTorso">
        <div class="card-head"><span class="card-name">Torso</span><span class="option-index" id="idxTorso"></span></div>
        <div class="card-val" id="valTorso">👕</div><div class="option-name" id="nameTorso"></div><div class="option-price" id="priceTorso"></div>
        <div class="controls"><button class="ctrl" onclick="changeAvatar('torso',-1)">◀</button><span></span><button class="ctrl" id="buyTorso" onclick="buyCurrentAvatar('torso')">▶</button></div>
      </div>
      <div class="card" id="cardLegs">
        <div class="card-head"><span class="card-name">Bottoms</span><span class="option-index" id="idxLegs"></span></div>
        <div class="card-val" id="valLegs">👖</div><div class="option-name" id="nameLegs"></div><div class="option-price" id="priceLegs"></div>
        <div class="controls"><button class="ctrl" onclick="changeAvatar('legs',-1)">◀</button><span></span><button class="ctrl" id="buyLegs" onclick="buyCurrentAvatar('legs')">▶</button></div>
      </div>
      <div class="card" id="cardAcc">
        <div class="card-head"><span class="card-name">Accessory</span><span class="option-index" id="idxAcc"></span></div>
        <div class="card-val" id="valAcc">❌</div><div class="option-name" id="nameAcc"></div><div class="option-price" id="priceAcc"></div>
        <div class="controls"><button class="ctrl" onclick="changeAvatar('accessory',-1)">◀</button><span></span><button class="ctrl" id="buyAcc" onclick="buyCurrentAvatar('accessory')">▶</button></div>
      </div>
    </div>
  </div>

  <div class="section studio-section" id="studioSection">
    <div class="studio-card">
      <div class="studio-name">WALLS / WALLPAPER</div><div class="card-val" id="valWalls">🧱</div><div></div>
      <div class="controls"><button class="ctrl" onclick="changeStudio('walls',-1)">◀</button><span></span><button class="ctrl" onclick="changeStudio('walls',1)">▶</button></div>
    </div>
    <div class="studio-card">
      <div class="studio-name">NEON LIGHTING</div><div class="card-val" id="valNeon">🔴</div><div></div>
      <div class="controls"><button class="ctrl" onclick="changeStudio('neon',-1)">◀</button><span></span><button class="ctrl" onclick="changeStudio('neon',1)">▶</button></div>
    </div>
    <div class="studio-card">
      <div class="studio-name">WALL POSTER</div><div class="card-val" id="valPoster">🖼️</div><div></div>
      <div class="controls"><button class="ctrl" onclick="changeStudio('poster',-1)">◀</button><span></span><button class="ctrl" onclick="changeStudio('poster',1)">▶</button></div>
    </div>
    <div class="studio-card">
      <div class="studio-name">PET IN FRAME</div><div class="card-val" id="valPet">❌</div><div></div>
      <div class="controls"><button class="ctrl" onclick="changeStudio('pet',-1)">◀</button><span></span><button class="ctrl" onclick="changeStudio('pet',1)">▶</button></div>
    </div>
  </div>

  <button class="save" onclick="saveConfig()" id="saveBtnTxt">💾 СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
  <div class="footer">Tube Empire • CREATOR CUSTOMIZATION SYSTEM • v1.0</div>
</div>

<script>
const avatarLang={
 ru:{title:"КАСТОМИЗАЦИЯ",avatar:"👤 АВАТАР БЛОГЕРА",studio:"🏢 СТУДИЯ / ИНТЕРЬЕР",save:"💾 СОХРАНИТЬ ИЗМЕНЕНИЯ",saved:"✨ Изменения сохранены!"},
 de:{title:"ANPASSUNG",avatar:"👤 CREATOR-AVATAR",studio:"🏢 STUDIO / INTERIEUR",save:"💾 ÄNDERUNGEN SPEICHERN",saved:"✨ Änderungen gespeichert!"},
 en:{title:"CUSTOMIZATION",avatar:"👤 CREATOR AVATAR",studio:"🏢 STUDIO / INTERIOR",save:"💾 SAVE CHANGES",saved:"✨ Changes saved!"}
};
function tr(k){const l=Core.getLang();return (avatarLang[l]||avatarLang.ru)[k]||avatarLang.ru[k]}

const avatarOptions={
  /* 20 базовых вариантов персонажа */
  gender:[
    '👦','👧','👨','👩','🧑','🧔','👱‍♂️','👱‍♀️','👨‍🦰','👩‍🦰',
    '👨‍🦱','👩‍🦱','👨‍🦳','👩‍🦳','👨‍🦲','👩‍🦲','🧑‍🦰','🧑‍🦱','🧑‍🦳','🧑‍🦲'
  ],

  /* 20 вариантов головы / волос / головного убора */
  head:[
    '👤','💇‍♂️','💇‍♀️','🧢','🎧','🕶️','👓','🤓','🎩','🧢',
    '🎧','👒','🪖','⛑️','👑','🧢','🎩','👓','🕶️','🎧'
  ],

  /* 20 вариантов одежды верхней части */
  torso:[
    '👕','👕','👕','🧥','🧥','👔','👔','🥼','🥼','👚',
    '👚','🧥','🦺','🥋','🧥','👕','👔','🥼','👚','🦺'
  ],

  /* 20 вариантов низа */
  legs:[
    '👖','👖','👖','🩳','🩳','🩳','👗','👗','🥻','🥻',
    '👖','🩳','👖','🩳','👗','🥻','👖','🩳','👗','👖'
  ],

  /* 20 аксессуаров: ❌ + 19 предметов */
  accessory:[
    '❌','🎙️','📷','📱','🎮','🎧','⌚','💻','🕶️','🎤',
    '🎙️','📷','📱','🎮','🎧','⌚','💻','🕶️','🎤','🎙️'
  ]
};

const avatarOptionNames={
  gender:[
    'Подросток','Подросток','Мужчина','Женщина','Персонаж','Бородатый','Блондин','Блондинка','Рыжий','Рыжая',
    'Кудрявый','Кудрявая','Седой','Седая','Бритый','Бритая','Рыжеволосый','Кудрявый','Седой','Бритый'
  ],
  head:[
    'Без убора','Короткая причёска','Длинная причёска','Бейсболка','Наушники','Тёмные очки','Очки','Гик-очки','Цилиндр','Кепка',
    'Гарнитура','Шляпа','Тактическая шапка','Защитный шлем','Корона','Кепка тёмная','Цилиндр чёрный','Очки светлые','Очки тёмные','Гарнитура'
  ],
  torso:[
    'Футболка','Футболка синяя','Футболка зелёная','Куртка','Куртка тёмная','Рубашка','Рубашка тёмная','Халат','Халат белый','Топ',
    'Топ светлый','Ветровка','Жилет','Кимоно','Кожаная куртка','Футболка тёмная','Рубашка светлая','Худи','Топ тёмный','Жилет тёмный'
  ],
  legs:[
    'Джинсы','Джинсы синие','Джинсы тёмные','Шорты','Шорты спортивные','Шорты тёмные','Юбка','Юбка тёмная','Штаны свободные','Штаны свободные тёмные',
    'Джинсы чёрные','Шорты светлые','Джинсы светлые','Шорты серые','Юбка светлая','Штаны песочные','Джинсы серые','Шорты чёрные','Юбка красная','Джинсы графитовые'
  ],
  accessory:[
    'Нет','Студийный микрофон','Фотоаппарат','Смартфон','Геймпад','Наушники','Умные часы','Ноутбук','Очки','Микрофон',
    'Настольный микрофон','Компактная камера','Телефон','Контроллер','Игровые наушники','Часы','Ультрабук','Солнцезащитные очки','Вокальный микрофон','Микрофон'
  ]
};


const avatarPrices={
  gender:[0,0,0,0,0,100,200,400,800,1600,3200,6400,12800,25600,51200,102400,204800,409600,819200,1638400],
  head:[0,0,0,0,0,100,200,400,800,1600,3200,6400,12800,25600,51200,102400,204800,409600,819200,1638400],
  torso:[0,0,0,0,0,100,200,400,800,1600,3200,6400,12800,25600,51200,102400,204800,409600,819200,1638400],
  legs:[0,0,0,0,0,100,200,400,800,1600,3200,6400,12800,25600,51200,102400,204800,409600,819200,1638400],
  accessory:[0,0,0,0,0,100,200,400,800,1600,3200,6400,12800,25600,51200,102400,204800,409600,819200,1638400]
};

const AVATAR_UNLOCK_KEY='tube_empire_avatar_unlocks_v1';
let avatarUnlocks=JSON.parse(localStorage.getItem(AVATAR_UNLOCK_KEY)||'{}');

function avatarItemKey(type,index){return `${type}_${index}`}

function avatarOwned(type,index){
  return avatarPrices[type][index]===0 || avatarUnlocks[avatarItemKey(type,index)]===true;
}

function avatarPrice(type,index){
  return Number(avatarPrices[type][index])||0;
}

function avatarBuy(type,index){
  if(avatarOwned(type,index)) return true;
  const price=avatarPrice(type,index);
  if(!price) return true;
  if(!Core.spendMoney(price)) return false;
  avatarUnlocks[avatarItemKey(type,index)]=true;
  localStorage.setItem(AVATAR_UNLOCK_KEY,JSON.stringify(avatarUnlocks));
  try{Core.playSound('buy');Core.haptic('medium')}catch(e){}
  return true;
}

const studioOptions={
 walls:['🧱','🪵','🟫','⬛','🟦'],
 neon:['🔴','🔵','🟢','🟣','🟡'],
 poster:['🖼️','🎮','🚀','🔥','⭐'],
 pet:['❌','🐱','🐶','🤖','🦜']
};

let currentAvatar=JSON.parse(localStorage.getItem("tube_empire_avatar_config")||'{"gender":0,"head":0,"torso":0,"legs":0,"accessory":0}');
let currentStudio=JSON.parse(localStorage.getItem("tube_empire_studio_config")||'{"walls":0,"neon":0,"poster":0,"pet":0}');
let activeTab='avatar';

function safeIndex(obj,key,len){obj[key]=Math.max(0,Math.min(len-1,Number(obj[key])||0))}
Object.keys(avatarOptions).forEach(k=>safeIndex(currentAvatar,k,avatarOptions[k].length));
Object.keys(studioOptions).forEach(k=>safeIndex(currentStudio,k,studioOptions[k].length));

function switchTab(tab){
 activeTab=tab;
 document.getElementById('tabAvatar').classList.toggle('active',tab==='avatar');
 document.getElementById('tabStudio').classList.toggle('active',tab==='studio');
 document.getElementById('avatarSection').style.display=tab==='avatar'?'block':'none';
 document.getElementById('studioSection').style.display=tab==='studio'?'block':'none';
 document.getElementById('modeTitle').textContent=tab==='avatar'?'AVATAR LOADOUT':'STUDIO LOADOUT';
 updatePreview();
}

function buyCurrentAvatar(type){
  const index=currentAvatar[type];
  if(avatarOwned(type,index)){
    try{Core.playSound('click')}catch(e){}
    return;
  }
  if(avatarBuy(type,index)){
    updateUI();
  }else{
    try{Core.playSound('error')}catch(e){}
    alert(`Недостаточно средств. Нужно ${avatarPrice(type,index).toLocaleString('de-DE')} €.`);
  }
}

function changeAvatar(type,dir){
 const len=avatarOptions[type].length;
 currentAvatar[type]=(currentAvatar[type]+dir+len)%len;
 try{Core.playSound(440,'sine',.05);Core.haptic('light')}catch(e){}
 updateUI();
}
function changeStudio(type,dir){
 const len=studioOptions[type].length;
 currentStudio[type]=(currentStudio[type]+dir+len)%len;
 Core.playSound(440,'sine',.05);
 try{Core.haptic('light')}catch(e){}
 updateUI();
}
function setVal(id,val,idx,len){
 const e=document.getElementById(id);if(e)e.textContent=val;
 const i=document.getElementById(idx);if(i)i.textContent=`${Number(i.dataset.n||0)+1} / ${len}`;
}
function updateUI(){
 const l=Core.getLang();
 document.documentElement.lang=l;
 document.getElementById('headerTitle').textContent=tr('title');
 document.getElementById('tabAvatar').textContent=tr('avatar');
 document.getElementById('tabStudio').textContent=tr('studio');
 document.getElementById('saveBtnTxt').textContent=tr('save');
 document.getElementById('profileName').textContent=String(Core.getUserName("BLOGGER")).toUpperCase();

 const map=[
  ['valGender','idxGender','gender'],['valHead','idxHead','head'],
  ['valTorso','idxTorso','torso'],['valLegs','idxLegs','legs'],['valAcc','idxAcc','accessory']
 ];
 map.forEach(([v,i,k])=>{
   const index=currentAvatar[k];
   const owned=avatarOwned(k,index);
   const price=avatarPrice(k,index);
   document.getElementById(v).textContent=avatarOptions[k][index];
   document.getElementById(i).textContent=`${index+1} / ${avatarOptions[k].length}`;
   const nameId={gender:'nameGender',head:'nameHead',torso:'nameTorso',legs:'nameLegs',accessory:'nameAcc'}[k];
   const priceId={gender:'priceGender',head:'priceHead',torso:'priceTorso',legs:'priceLegs',accessory:'priceAcc'}[k];
   const buyId={gender:'buyGender',head:'buyHead',torso:'buyTorso',legs:'buyLegs',accessory:'buyAcc'}[k];
   const cardId={gender:'cardGender',head:'cardHead',torso:'cardTorso',legs:'cardLegs',accessory:'cardAcc'}[k];
   document.getElementById(nameId).textContent=avatarOptionNames[k][index];
   document.getElementById(priceId).textContent=owned?'✓ FREE / UNLOCKED':`🔒 ${price.toLocaleString('de-DE')} €`;
   document.getElementById(priceId).style.color=owned?'#49d17d':'#ffc928';
   document.getElementById(buyId).textContent=owned?'✓':'€';
   document.getElementById(buyId).disabled=owned;
   document.getElementById(cardId).style.borderColor=owned?'#3d4853':'#675c35';
 });
 ['walls','neon','poster','pet'].forEach(k=>{
   const id={walls:'valWalls',neon:'valNeon',poster:'valPoster',pet:'valPet'}[k];
   document.getElementById(id).textContent=studioOptions[k][currentStudio[k]];
 });
 updatePreview();
}
function updatePreview(){
 const screen=document.getElementById('characterPreview');
 if(activeTab==='avatar'){
   document.getElementById('previewGender').textContent=avatarOptions.gender[currentAvatar.gender];
   document.getElementById('previewHead').textContent=avatarOptions.head[currentAvatar.head];
   document.getElementById('previewTorso').textContent=avatarOptions.torso[currentAvatar.torso];
   document.getElementById('previewLegs').textContent=avatarOptions.legs[currentAvatar.legs];
   const acc=avatarOptions.accessory[currentAvatar.accessory];
   document.getElementById('previewAccessory').textContent=acc==='❌'?'':acc;
   screen.style.display='block';
 }else{
   screen.innerHTML=`
     <div class="avatar-layer" style="top:36px;font-size:40px;">💻</div>
     <div class="avatar-layer" style="right:5px;left:auto;transform:none;top:62px;font-size:20px;">
       ${studioOptions.pet[currentStudio.pet]==='❌'?'':studioOptions.pet[currentStudio.pet]}
     </div>`;
   screen.style.display='block';
   document.getElementById('previewScreen').style.background=
     `linear-gradient(180deg,rgba(255,51,72,.10),rgba(0,0,0,.25)),linear-gradient(135deg,#202a34,#10161c)`;
 }
}
function saveConfig(){
 const locked=Object.keys(avatarOptions).find(k=>!avatarOwned(k,currentAvatar[k]));
 if(locked){
   const price=avatarPrice(locked,currentAvatar[locked]);
   alert(`Этот вариант ещё не открыт. Стоимость: ${price.toLocaleString('de-DE')} €.`);
   return;
 }
 localStorage.setItem("tube_empire_avatar_config",JSON.stringify(currentAvatar));
 localStorage.setItem("tube_empire_studio_config",JSON.stringify({...currentStudio,avatar:Number(currentAvatar.head)||0}));
 try{
   window.GameState?.set("avatar",currentAvatar);
   window.GameState?.set("studio",currentStudio);
 }catch(e){}
 Core.playSound(880,'square',.15);
 try{Core.haptic('medium')}catch(e){}
 alert(tr("saved"));
 window.location.href="index.html";
}
document.addEventListener("DOMContentLoaded",updateUI);
</script>
</body>
</html>
