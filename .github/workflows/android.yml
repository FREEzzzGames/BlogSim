name: Android (parked)
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Run Android build manually"
        required: true
        default: "true"
        type: boolean
permissions:
  contents: read
jobs:
  build:
    if: ${{ inputs.build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlogSim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
