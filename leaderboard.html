<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tube Empire — Bestenliste</title><script src="core.js"></script><style>
:root{--bg:#05070b;--p:#111820;--p2:#18222c;--line:#3d4b57;--gold:#ffd54a;--red:#ff2638;--text:#f5f7fa;--muted:#8995a4}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{display:flex;justify-content:center}.page{width:100%;max-width:620px;height:100dvh;padding:8px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,#090e14,#05070b)}.head{height:42px;display:flex;align-items:center}.home{width:44px;height:38px;border-radius:6px;border:1px solid #52606c;background:#17212a;color:#fff;font-size:19px}.title{flex:1;text-align:center;font-size:11px;font-weight:950;color:var(--gold)}.info{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--p);text-align:center;font-size:7px;color:var(--muted)}.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px}.row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--p2);font-size:8px}.row.me{border-color:var(--gold);box-shadow:0 0 12px #ffd54a22}.score{font-weight:950;color:var(--gold)}.rank{width:28px;font-weight:950}
</style></head><body><main class="page"><div class="head"><button class="home" onclick="location.href='index.html'">⌂</button><div class="title" id="title">📊 ТАБЛИЦА ЛИДЕРОВ</div></div><div class="info" id="info">Рейтинг по просмотрам и подписчикам</div><div class="list" id="list"></div></main><script>
const T={ru:{title:'📊 ТАБЛИЦА ЛИДЕРОВ',info:'Рейтинг по просмотрам и подписчикам',you:'Вы'},de:{title:'📊 BESTENLISTE',info:'Ranking nach Aufrufen und Abonnenten',you:'Du'},en:{title:'📊 LEADERBOARD',info:'Ranking by views and subscribers',you:'You'}};
const bots=[['NovaTube',820000,64000],['PixelCreator',610000,51000],['DailyPro',440000,39000],['StreamForge',300000,27000],['ClipMaster',190000,18000],['MediaFox',100000,12000],['TrendLab',52000,7000],['NextCreator',22000,3500],['StarterX',8000,1400]];
function render(){const q=T[Core.getLang()]||T.ru,s=Core.getState(),v=Number(s.channel?.views)||0,sub=Number(s.channel?.subscribers)||0;const score=x=>x[1]+x[2]*5;let a=bots.map(x=>({name:x[0],v:x[1],s:x[2],score:score(x)}));a.push({name:q.you+' ('+Core.getUserName('Blogger')+')',v, s:sub,score:v+sub*5,me:true});a.sort((x,y)=>y.score-x.score);document.getElementById('title').textContent=q.title;document.getElementById('info').textContent=q.info;document.getElementById('list').innerHTML=a.map((x,i)=>`<div class="row ${x.me?'me':''}"><div><span class="rank">#${i+1}</span><b>${x.name}</b><div style="font-size:6px;color:var(--muted);margin-top:3px">👀 ${x.v.toLocaleString()} • 👥 ${x.s.toLocaleString()}</div></div><div class="score">${x.score.toLocaleString()}</div></div>`).join('')}document.addEventListener('DOMContentLoaded',render);setInterval(render,1000);
</script></body></html>
