<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FREEzzzGames Reaction</title><link rel="stylesheet" href="arcade_style.css"></head><body><main class="page"><div class="head"><button class="home" onclick="location.href='arcade.html'">⌂</button><div class="title">⚡ REACTION</div></div><div class="hint">Одна независимая аркада — общий только числовой результат.</div><section class="card game"><div class="kicker">ARCADE MODE</div><h1>REACTION TEST</h1><div class="best" id="best">Рекорд: —</div><div class="arena"><button id="react">НАЖМИ КОГДА<br>ПОЯВИТСЯ СИГНАЛ</button><div id="result"></div></div><div class="msg" id="msg"></div><button class="btn primary" id="start">СТАРТ</button></section><div class="footer">Tube Empire v5.8 • FREEzzzGames Arcade</div></main><script src="arcade_core.js"></script><script>let timer=0,ready=false,t0=0;const $=id=>document.getElementById(id);function render(){const b=ArcadeCore.getReactionBest();$('best').textContent='Рекорд: '+(b?b+' ms':'—')}$('start').onclick=()=>{clearTimeout(timer);ready=false;$('react').classList.remove('go');$('react').textContent='ЖДИ СИГНАЛ…';timer=setTimeout(()=>{ready=true;t0=performance.now();$('react').classList.add('go');$('react').textContent='НАЖМИ!'},700+Math.random()*2200)};$('react').onclick=()=>{if(!ready){$('msg').textContent='Дождись сигнала';return}const ms=Math.round(performance.now()-t0);ready=false;$('react').classList.remove('go');$('react').textContent='✓';$('result').textContent=ms+' ms';$('result').classList.remove('show');void $('result').offsetWidth;$('result').classList.add('show');const b=ArcadeCore.getReactionBest();if(!b||ms<b)ArcadeCore.setReactionBest(ms);ArcadeCore.addTotalScore(Math.max(1,Math.round(1000/ms)));render();setTimeout(()=>$('result').classList.remove('show'),800)};render()</script><style>.game{text-align:center}.kicker{color:#35b8ff;font:900 8px monospace;letter-spacing:1px}.game h1{font-size:18px;margin:4px}.best{color:#ffd54a;font:900 9px monospace}.arena{position:relative;flex:1;display:flex;align-items:center;justify-content:center}.arena button{width:min(58vw,220px);height:min(58vw,220px);max-width:220px;max-height:220px;border-radius:50%;border:3px solid #35b8ff;background:radial-gradient(circle,#203347,#071019 70%);color:#fff;font-size:12px;font-weight:1000;touch-action:manipulation}.arena button.go{border-color:#39e879;background:#0c3220}.arena #result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.35);opacity:0;font:1000 42px monospace;text-shadow:0 0 14px #35b8ff;pointer-events:none}.arena #result.show{animation:pop .8s forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}20%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) translateY(-80px) scale(1.15)}}.msg{height:30px;color:#8995a4;font-size:8px}</style></body></html>
