<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FREEzzzGames 8-Bit Racing</title><link rel="stylesheet" href="arcade_style.css"></head><body><main class="page"><div class="head"><button class="home" onclick="location.href='arcade.html'">⌂</button><div class="title">🏎️ 8-BIT ROAD RACER</div></div><div class="hint">◀ ▶ слева — руль. ⛽ и 🛑 справа — газ и тормоз.</div><section class="card race"><div class="top"><b>8-BIT ROAD RACER</b><div><span id="speed">SPEED 0</span> <span id="score">SCORE 0</span></div></div><div class="canvas"><canvas id="c" width="360" height="430"></canvas></div><div class="controls"><div><button id="l">◀</button><button id="rr">▶</button></div><div><button id="g" class="gas">⛽<small>ГАЗ</small></button><button id="b" class="brake">🛑<small>ТОРМОЗ</small></button></div></div><div class="actions"><button class="btn primary" id="start">СТАРТ ГОНКИ</button><button class="btn" id="reset">ЗАНОВО</button></div><div class="msg" id="msg">Нажми «СТАРТ ГОНКИ»</div></section><div class="footer">Tube Empire v5.8 • FREEzzzGames Arcade</div></main><script src="arcade_core.js"></script><script>const c=$('c'),x=c.getContext('2d');function $(i){return document.getElementById(i)}x.imageSmoothingEnabled=false;const R={run:false,x:180,s:0,d:0,off:0,obs:[],sp:0,last:0,raf:0,k:{l:0,r:0,g:0,b:0}};function bind(id,k){const e=$(id),d=a=>{a.preventDefault();R.k[k]=1;e.classList.add('p')},u=a=>{a.preventDefault();R.k[k]=0;e.classList.remove('p')};e.onpointerdown=d;e.onpointerup=u;e.onpointercancel=u;e.onpointerleave=u}bind('l','l');bind('rr','r');bind('g','g');bind('b','b');function car(a,y,me){x.fillStyle=me?'#e52b3a':'#35b8ff';x.fillRect(a-10,y-15,20,30);x.fillStyle='#111';x.fillRect(a-13,y-10,4,8);x.fillRect(a+9,y-10,4,8);x.fillRect(a-13,y+5,4,8);x.fillRect(a+9,y+5,4,8);x.fillStyle=me?'#ff6972':'#8be0ff';x.fillRect(a-7,y-10,14,9)}function draw(){x.fillStyle='#164426';x.fillRect(0,0,360,430);x.fillStyle='#34383d';x.fillRect(72,0,216,430);let z=Math.floor(R.off)%32;for(let y=-32+z;y<430;y+=32){x.fillStyle='#fff';x.fillRect(61,y,11,16);x.fillRect(288,y,11,16);x.fillStyle='#ff2638';x.fillRect(61,y+16,11,16);x.fillRect(288,y+16,11,16)}x.fillStyle='#d9dde0';for(let ln=1;ln<3;ln++){let a=72+ln*72;for(let y=-30+z;y<430;y+=42)x.fillRect(a-2,y,4,22)}R.obs.forEach(o=>car(o.x,o.y,0));car(R.x,358,1)}function reset(){R.run=0;cancelAnimationFrame(R.raf);R.x=180;R.s=0;R.d=0;R.off=0;R.obs=[];R.sp=0;draw();$('msg').textContent='Нажми «СТАРТ ГОНКИ»';ui()}function ui(){$('speed').textContent='SPEED '+Math.round(R.s*12);$('score').textContent='SCORE '+Math.floor(R.d*10)}function start(){if(R.run)return;R.run=1;R.last=performance.now();R.raf=requestAnimationFrame(loop)}function loop(t){if(!R.run)return;let dt=Math.min((t-R.last)/1000,.035);R.last=t;if(R.k.g)R.s=Math.min(9,R.s+12*dt);else R.s=Math.max(2.2,R.s-4*dt);if(R.k.b)R.s=Math.max(0,R.s-18*dt);if(R.k.l)R.x-=145*dt;if(R.k.r)R.x+=145*dt;R.x=Math.max(100,Math.min(260,R.x));R.d+=R.s*dt;R.off+=R.s*32*dt;R.sp-=dt;if(R.sp<=0){R.obs.push({x:108+Math.floor(Math.random()*3)*72,y:-35});R.sp=Math.max(.38,1.25-R.s*.06)}R.obs.forEach(o=>o.y+=R.s*38*dt);R.obs=R.obs.filter(o=>o.y<470);for(const o of R.obs)if(Math.abs(o.x-R.x)<23&&Math.abs(o.y-358)<34){R.run=0;R.s=0;const sc=Math.floor(R.d*10);if(sc>ArcadeCore.getRacingBest())ArcadeCore.setRacingBest(sc);ArcadeCore.addTotalScore(sc);$('msg').textContent='💥 АВАРИЯ!';draw();ui();return}draw();ui();R.raf=requestAnimationFrame(loop)}$('start').onclick=start;$('reset').onclick=reset;reset()</script><style>.race{gap:6px}.top{text-align:center;font-size:13px}.top div{display:flex;justify-content:space-around;color:#ffd54a;font:900 8px monospace;margin-top:4px}.canvas{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden;border:2px solid #252f38;border-radius:7px}.canvas canvas{width:min(100%,360px);height:auto;image-rendering:pixelated}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.controls>div{display:grid;grid-template-columns:1fr 1fr;gap:6px}.controls button{min-height:48px;border:1px solid #65727e;border-radius:7px;background:linear-gradient(#27343f,#111920);color:#fff;font-size:20px;font-weight:950;touch-action:manipulation}.controls small{display:block;font-size:5px}.gas{border-color:#39a86b!important}.brake{border-color:#a94750!important}.controls button.p{background:#263d4b;transform:translateY(1px)}.actions{display:grid;grid-template-columns:2fr 1fr;gap:6px}.msg{height:22px;text-align:center;color:#8995a4;font-size:8px}</style></body></html>
