<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Студия и Аватар</title>
<script src="core.js"></script>
<style>
:root, [data-theme="dark"] {
  --portal-bg: rgba(20, 10, 10, 0.96);
  --border-col: rgba(255, 0, 0, 0.5);
  --accent-col: #ff0000;
  --title-col: #ffcc00;
  --btn-bg: rgba(40, 15, 15, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --success-col: #2ecc71;
  --text-main: #fff;
  --text-sub: #ff8888;
  --body-bg: #0a0505;
}
[data-theme="rose"] {
  --portal-bg: rgba(30, 10, 25, 0.96);
  --border-col: rgba(233, 30, 99, 0.6);
  --accent-col: #e91e63;
  --title-col: #ffeb3b;
  --btn-bg: rgba(60, 15, 40, 0.9);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --success-col: #00e676;
  --text-main: #fff;
  --text-sub: #ff80ab;
  --body-bg: #150510;
}
[data-theme="light"] {
  --portal-bg: rgba(245, 247, 250, 0.96);
  --border-col: rgba(211, 47, 47, 0.4);
  --accent-col: #d32f2f;
  --title-col: #e65100;
  --btn-bg: rgba(255, 255, 255, 0.9);
  --glass-bg: rgba(230, 235, 245, 0.85);
  --success-col: #2e7d32;
  --text-main: #1a1a1a;
  --text-sub: #555555;
  --body-bg: #e0e4ec;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;height:100%;background:var(--body-bg);color:var(--text-main);font-family:monospace;overflow:hidden;transition:background 0.3s;}
body{padding:4px;display:flex;justify-content:center;align-items:center;position:fixed;inset:0;}
.portal{
  width: 100%; height: 100%; max-width: 420px; max-height: 100vh;
  text-align: center; display: flex; flex-direction: column; justify-content: space-between;
  padding: 6px; z-index: 10; background: var(--portal-bg); border: 2px solid var(--border-col);
  border-radius: 14px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.2); position: relative;
}
.game-ui-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 8px; width: 100%; flex-shrink: 0; font-size: 10.5px; }
.back-btn { background: rgba(217, 30, 30, 0.85); border: 1px solid #ff4d4d; color: #fff; padding: 3px 5px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 8px; }
.tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; flex-shrink: 0; }
.tab-btn { background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px; padding: 5px; font-size: 8.5px; color: var(--text-main); font-family: monospace; font-weight: bold; cursor: pointer; text-align: center; }
.tab-btn.active { background: var(--accent-col); border-color: var(--title-col); color: #fff; }

.preview-box { background: var(--glass-bg); border: 1px solid var(--border-col); border-radius: 8px; padding: 8px; text-align: center; width: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.preview-screen { width: 100px; height: 75px; background: #111; border: 2px solid var(--title-col); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; overflow: hidden; }

.customizer-container { flex-grow: 1; width: 100%; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 2px 0; }
.custom-row { background: var(--btn-bg); border: 1px solid var(--border-col); border-radius: 6px; padding: 5px 8px; display: flex; align-items: center; justify-content: space-between; font-size: 9px; }
.custom-btn-group { display: flex; gap: 4px; align-items: center; }
.custom-ctrl-btn { background: var(--glass-bg); border: 1px solid var(--accent-col); color: var(--text-main); padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 10px; }
.custom-ctrl-btn:active { background: var(--accent-col); }

.save-btn { width: 100%; background: linear-gradient(135deg, var(--title-col), #c09a00); border: none; border-radius: 6px; padding: 8px; font-weight: bold; font-size: 10px; color: #000; cursor: pointer; font-family: monospace; flex-shrink: 0; margin-top: 2px; }
</style>
<link rel="stylesheet" href="tube-theme.css">
</head>
<body>

<div class="portal">
  <div class="game-ui-header">
  <div class="internal-nav">
    <a href="index.html" class="page-menu-btn" aria-label="Меню">⌂</a>
  </div>
  <div id="headerTitle">🎨 КАСТОМИЗАЦИЯ</div>
</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('avatar')" id="tabAvatar">👤 Аватар блогера</button>
    <button class="tab-btn" onclick="switchTab('studio')" id="tabStudio">🏢 Студия / Интерьер</button>
  </div>

  <div class="preview-box">
    <div class="preview-screen" id="previewScreen">👦👤</div>
    <div style="font-size: 8px; color: var(--text-sub);" id="previewDesc">Предпросмотр</div>
  </div>

  <!-- Вкладка Аватар -->
  <div class="customizer-container" id="avatarSection" style="display: flex;">
    <div class="custom-row">
      <span id="lblGender">Пол</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeAvatar('gender', -1)">◀</button>
        <span id="valGender" style="width: 25px; text-align: center;">👦</span>
        <button class="custom-ctrl-btn" onclick="changeAvatar('gender', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblHead">Голова / Убор</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeAvatar('head', -1)">◀</button>
        <span id="valHead" style="width: 25px; text-align: center;">👤</span>
        <button class="custom-ctrl-btn" onclick="changeAvatar('head', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblTorso">Одежда (Торс)</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeAvatar('torso', -1)">◀</button>
        <span id="valTorso" style="width: 25px; text-align: center;">👕</span>
        <button class="custom-ctrl-btn" onclick="changeAvatar('torso', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblLegs">Низ</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeAvatar('legs', -1)">◀</button>
        <span id="valLegs" style="width: 25px; text-align: center;">👖</span>
        <button class="custom-ctrl-btn" onclick="changeAvatar('legs', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblAcc">Аксессуар</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeAvatar('accessory', -1)">◀</button>
        <span id="valAcc" style="width: 25px; text-align: center;">❌</span>
        <button class="custom-ctrl-btn" onclick="changeAvatar('accessory', 1)">▶</button>
      </div>
    </div>
  </div>

  <!-- Вкладка Студия / Интерьер -->
  <div class="customizer-container" id="studioSection" style="display: none;">
    <div class="custom-row">
      <span id="lblWall">Обои / Стены</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeStudio('walls', -1)">◀</button>
        <span id="valWalls" style="width: 25px; text-align: center;">🧱</span>
        <button class="custom-ctrl-btn" onclick="changeStudio('walls', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblNeon">Неоновая подсветка</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeStudio('neon', -1)">◀</button>
        <span id="valNeon" style="width: 25px; text-align: center;">🔴</span>
        <button class="custom-ctrl-btn" onclick="changeStudio('neon', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblPoster">Постер на стену</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeStudio('poster', -1)">◀</button>
        <span id="valPoster" style="width: 25px; text-align: center;">🖼️</span>
        <button class="custom-ctrl-btn" onclick="changeStudio('poster', 1)">▶</button>
      </div>
    </div>
    <div class="custom-row">
      <span id="lblPet">Питомец в кадре</span>
      <div class="custom-btn-group">
        <button class="custom-ctrl-btn" onclick="changeStudio('pet', -1)">◀</button>
        <span id="valPet" style="width: 25px; text-align: center;">❌</span>
        <button class="custom-ctrl-btn" onclick="changeStudio('pet', 1)">▶</button>
      </div>
    </div>
  </div>

  <button class="save-btn" onclick="saveConfig()" id="saveBtnTxt">💾 СОХРАНИТЬ ИЗМЕНЕНИЯ</button>
</div>

<script>
const avatarLang={
ru:{menu:"⬅ МЕНЮ",title:"🎨 КАСТОМИЗАЦИЯ",avatarTab:"👤 Аватар блогера",studioTab:"🏢 Студия / Интерьер",preview:"Предпросмотр",gender:"Пол",head:"Голова / Убор",torso:"Одежда (Торс)",legs:"Низ",accessory:"Аксессуар",walls:"Обои / Стены",neon:"Неоновая подсветка",poster:"Постер на стену",pet:"Питомец в кадре",save:"💾 СОХРАНИТЬ ИЗМЕНЕНИЯ",saved:"✨ Изменения сохранены!"},
de:{menu:"⬅ MENÜ",title:"🎨 ANPASSUNG",avatarTab:"👤 Creator-Avatar",studioTab:"🏢 Studio / Interieur",preview:"Vorschau",gender:"Geschlecht",head:"Kopf / Kopfbedeckung",torso:"Kleidung (Oberkörper)",legs:"Unterteil",accessory:"Accessoire",walls:"Wände / Tapete",neon:"Neonbeleuchtung",poster:"Wandposter",pet:"Haustier im Bild",save:"💾 ÄNDERUNGEN SPEICHERN",saved:"✨ Änderungen gespeichert!"},
en:{menu:"⬅ MENU",title:"🎨 CUSTOMIZATION",avatarTab:"👤 Creator Avatar",studioTab:"🏢 Studio / Interior",preview:"Preview",gender:"Gender",head:"Head / Headwear",torso:"Clothing (Torso)",legs:"Bottoms",accessory:"Accessory",walls:"Walls / Wallpaper",neon:"Neon Lighting",poster:"Wall Poster",pet:"Pet in Frame",save:"💾 SAVE CHANGES",saved:"✨ Changes saved!"}
};
function ATr(k){const l=Core.getLang();return (avatarLang[l]||avatarLang.ru)[k]||avatarLang.ru[k]||k;}

const avatarOptions = {
  gender: ['👦','👧'],
  head: ['👤','🧢','🎧','🕶️','👑'],
  torso: ['👕','🧥','👔','🥼','👚'],
  legs: ['👖','🩳','🏃','👗','🥻'],
  accessory: ['❌','🎙️','📷','📱','💵']
};

const studioOptions = {
  walls: ['🧱', '🪵', '🟫', '⬛', '🟦'],
  neon: ['🔴', '🔵', '🟢', '🟣', '🟡'],
  poster: ['🖼️', '🎮', '🚀', '🔥', '⭐'],
  pet: ['❌', '🐱', '🐶', '🤖', '🦜']
};

let currentAvatar = JSON.parse(localStorage.getItem("tube_empire_avatar_config") || '{"gender":0,"head":0,"torso":0,"legs":0,"accessory":0}');
let currentStudio = JSON.parse(localStorage.getItem("tube_empire_studio_config") || '{"walls":0,"neon":0,"poster":0,"pet":0}');

let activeTab = 'avatar';

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tabAvatar').classList.toggle('active', tab === 'avatar');
  document.getElementById('tabStudio').classList.toggle('active', tab === 'studio');
  document.getElementById('avatarSection').style.display = tab === 'avatar' ? 'flex' : 'none';
  document.getElementById('studioSection').style.display = tab === 'studio' ? 'flex' : 'none';
  updatePreview();
}

function changeAvatar(type, dir) {
  let len = avatarOptions[type].length;
  currentAvatar[type] = (currentAvatar[type] + dir + len) % len;
  Core.playSound(440, 'sine', 0.05);
  Core.haptic('light');
  updateUI();
}

function changeStudio(type, dir) {
  let len = studioOptions[type].length;
  currentStudio[type] = (currentStudio[type] + dir + len) % len;
  Core.playSound(440, 'sine', 0.05);
  Core.haptic('light');
  updateUI();
}

function updateUI() {
  const l=Core.getLang();
  document.documentElement.lang=l;
  document.getElementById('menuBtnTxt').textContent=ATr('menu');
  document.getElementById('headerTitle').textContent=ATr('title');
  document.getElementById('tabAvatar').textContent=ATr('avatarTab');
  document.getElementById('tabStudio').textContent=ATr('studioTab');
  document.getElementById('previewDesc').textContent=ATr('preview');
  document.getElementById('lblGender').textContent=ATr('gender');
  document.getElementById('lblHead').textContent=ATr('head');
  document.getElementById('lblTorso').textContent=ATr('torso');
  document.getElementById('lblLegs').textContent=ATr('legs');
  document.getElementById('lblAcc').textContent=ATr('accessory');
  document.getElementById('lblWall').textContent=ATr('walls');
  document.getElementById('lblNeon').textContent=ATr('neon');
  document.getElementById('lblPoster').textContent=ATr('poster');
  document.getElementById('lblPet').textContent=ATr('pet');
  document.getElementById('saveBtnTxt').textContent=ATr('save');
  document.getElementById('valGender').textContent = avatarOptions.gender[currentAvatar.gender];
  document.getElementById('valHead').textContent = avatarOptions.head[currentAvatar.head];
  document.getElementById('valTorso').textContent = avatarOptions.torso[currentAvatar.torso];
  document.getElementById('valLegs').textContent = avatarOptions.legs[currentAvatar.legs];
  document.getElementById('valAcc').textContent = avatarOptions.accessory[currentAvatar.accessory];

  document.getElementById('valWalls').textContent = studioOptions.walls[currentStudio.walls];
  document.getElementById('valNeon').textContent = studioOptions.neon[currentStudio.neon];
  document.getElementById('valPoster').textContent = studioOptions.poster[currentStudio.poster];
  document.getElementById('valPet').textContent = studioOptions.pet[currentStudio.pet];

  updatePreview();
}

function updatePreview() {
  let screen = document.getElementById('previewScreen');
  if (activeTab === 'avatar') {
    let acc = avatarOptions.accessory[currentAvatar.accessory];
    let char = `${avatarOptions.gender[currentAvatar.gender]}${avatarOptions.head[currentAvatar.head]}${avatarOptions.torso[currentAvatar.torso]}`;
    screen.innerHTML = `<div style="font-size:20px;">${char}</div>${acc !== '❌' ? `<div style="position:absolute; bottom:2px; right:2px; font-size:12px;">${acc}</div>` : ''}`;
  } else {
    let wall = studioOptions.walls[currentStudio.walls];
    let neon = studioOptions.neon[currentStudio.neon];
    let poster = studioOptions.poster[currentStudio.poster];
    let pet = studioOptions.pet[currentStudio.pet];
    screen.innerHTML = `
      <div style="font-size:22px; background:${wall}; width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative;">
        <span style="position:absolute; top:2px; left:4px; font-size:10px;">${poster}</span>
        <span style="position:absolute; top:2px; right:4px; font-size:10px; filter:drop-shadow(0 0 4px #fff);">${neon}</span>
        <span style="position:absolute; bottom:2px; font-size:14px;">💻 ${pet !== '❌' ? pet : ''}</span>
      </div>
    `;
  }
}

function saveConfig() {
  localStorage.setItem("tube_empire_avatar_config", JSON.stringify(currentAvatar));
  localStorage.setItem("tube_empire_studio_config", JSON.stringify({...currentStudio, avatar: Number(currentAvatar.head)||0}));
  try { window.GameState?.set("avatar", currentAvatar); window.GameState?.set("studio", currentStudio); } catch(e) {}
  Core.playSound(880, 'square', 0.15);
  Core.haptic('medium');
  alert(ATr("saved"));
  window.location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", () => {
  updateUI();
});
</script>
</body>
</html>
