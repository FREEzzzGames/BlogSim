<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tube Empire — Главное меню</title>

<script src="core.js"></script>
<script src="economy.js"></script>
<script src="game-logic.js"></script>

<style>
:root{
  --bg:#05070b;
  --panel:#111820;
  --panel2:#19222c;
  --line:#3d4b57;
  --red:#ff2638;
  --red2:#ff5967;
  --green:#39e879;
  --blue:#35b8ff;
  --gold:#ffd54a;
  --text:#f5f7fa;
  --muted:#8995a4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:Arial,system-ui,sans-serif;
}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}

.portal{
  width:100%;max-width:620px;height:100dvh;position:relative;overflow:hidden;
  padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;
  background:
    radial-gradient(ellipse at 50% -12%,#26323e 0,#0c1218 34%,transparent 62%),
    linear-gradient(180deg,#090e14,#05070b);
}
.portal:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:
    linear-gradient(#fff1 1px,transparent 1px),
    linear-gradient(90deg,#fff1 1px,transparent 1px);
  background-size:34px 34px;
}

.top-controls{
  position:relative;z-index:4;display:flex;justify-content:flex-end;
  gap:5px;height:36px;flex:none;
}
.top-btn{
  min-width:68px;height:35px;padding:0 8px;
  border:1px solid #52606c;border-radius:5px;
  background:linear-gradient(180deg,#202a34,#11171e);
  font-size:8px;font-weight:950;
  box-shadow:inset 0 1px #fff2,0 5px 12px #0008;
}
.top-btn:active{transform:scale(.97);border-color:var(--red2)}

.brand{
  position:relative;z-index:2;height:94px;flex:none;
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;
}
.brand-mark{
  font-size:36px;line-height:32px;font-weight:1000;
  letter-spacing:-1.5px;color:#f5f7fa;
  text-shadow:0 3px 0 #26313b,0 0 24px #ff263833;
}
.brand-mark span{color:var(--red)}
.brand-mark b{
  display:block;font-size:17px;letter-spacing:7px;
  color:#aeb8c2;margin-top:5px;
}
.brand-sub{
  margin-top:8px;padding:4px 13px;
  border:1px solid #ff263866;border-radius:4px;
  background:linear-gradient(90deg,#241017,#111820,#241017);
  color:#f5f7fa;font-size:8px;letter-spacing:2px;font-weight:950;
  box-shadow:0 0 14px #ff26381c,inset 0 1px #fff1;
}

.account-chat{
  position:relative;z-index:2;
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  height:76px;flex:none;
}
.account-card,.chat-card{
  min-width:0;position:relative;display:flex;align-items:center;
  gap:8px;padding:7px 10px;
  background:linear-gradient(145deg,#19232d,#10161c);
  border:1px solid #43515d;border-radius:5px;
  box-shadow:inset 0 1px #fff2,0 7px 15px #0007;
  overflow:hidden;
}
.account-card:before,.chat-card:before,
.menu-tile:before{
  content:"";position:absolute;left:0;top:0;width:3px;height:100%;
  background:var(--red);box-shadow:0 0 10px #ff263844;
}
.account-card{cursor:pointer}
.account-card:active,.chat-card:active{
  transform:scale(.99);border-color:var(--red2);
}
.account-avatar{
  width:41px;height:41px;flex:none;display:flex;
  align-items:center;justify-content:center;
  background:#f3f3f3;color:#222;border-radius:6px;font-size:22px;
}
.account-info{min-width:0}
.account-name{font-size:10px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-balance{font-size:9px;color:var(--green);font-weight:950;margin-top:3px}
.account-level{font-size:6px;color:var(--muted);margin-top:3px}
.chat-card{
  display:block;padding:9px 29px 7px 10px;
}
.chat-title{font-size:7.5px;color:var(--gold);font-weight:950;margin-bottom:4px}
.chat-line{
  font-size:6px;color:#aab5c0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:12px;
}
.card-arrow{
  position:absolute;right:7px;top:50%;
  transform:translateY(-50%);
  width:26px;height:29px;display:flex;align-items:center;
  justify-content:center;border:1px solid #45525e;border-radius:4px;
  background:#131b23;font-size:22px;color:#dbe2e8;
}

.menu-grid{
  position:relative;z-index:2;flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,minmax(0,1fr));gap:6px;
}

.menu-tile{
  min-height:0;position:relative;
  display:flex;align-items:center;gap:8px;
  text-align:left;padding:8px 36px 8px 9px;
  border:1px solid #45535f;border-radius:5px;
  background:linear-gradient(145deg,#1c2731,#10161d);
  box-shadow:inset 0 1px #fff2,0 7px 15px #0007;
  overflow:hidden;
}
.menu-tile:active{transform:scale(.985);border-color:var(--red2)}
.menu-tile.primary{
  background:linear-gradient(145deg,#31141a,#171e26 55%,#10161c);
  border-color:#ff263877;
}
.menu-tile.primary:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 80% 50%,#ff263818,transparent 45%);
  pointer-events:none;
}
.tile-icon{
  font-size:23px;line-height:1;flex:none;
  width:32px;text-align:center;filter:drop-shadow(0 0 6px #000);
}
.tile-copy{min-width:0;position:relative;z-index:1}
.tile-title{
  font-size:9.5px;font-weight:950;letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tile-desc{
  font-size:6px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.menu-tile .card-arrow{
  width:23px;height:26px;font-size:20px;right:6px;
}

.footer{
  position:relative;z-index:2;height:12px;flex:none;
  text-align:center;color:#687582;font-size:5.5px;padding-top:1px;
}

.modal-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(0,0,0,.76);
  backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{
  width:min(340px,calc(100vw - 32px));padding:15px;
  background:linear-gradient(145deg,#1b252f,#0d1319);
  border:1px solid #5b6874;border-radius:7px;
  box-shadow:0 22px 55px #000,0 0 24px #ff26382a,inset 0 1px #fff2;
  transform:translateY(10px) scale(.95);
  transition:transform .2s ease;
}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-bottom:10px;
}
.modal-title{font-size:11px;font-weight:950;color:var(--gold)}
.modal-close{
  width:32px;height:32px;padding:0;border:1px solid #46535f;
  border-radius:5px;background:#111820;font-size:21px;
}
.chat-feed{
  height:150px;overflow:auto;text-align:left;
  padding:7px;border:1px solid #34414d;border-radius:5px;
  background:#080d12;color:#aab5c0;font-size:8px;
}
.chat-feed span{display:block;padding:5px 2px;border-bottom:1px solid #202932}
.chat-feed b{color:#f5f7fa}
.modal-row{display:flex;gap:5px;margin-top:7px}
.modal-input{
  flex:1;min-width:0;height:34px;padding:0 9px;
  border:1px solid #46535f;border-radius:5px;
  background:#080d12;color:#fff;outline:none;font-size:8px;
}
.modal-action{
  height:34px;padding:0 11px;border:1px solid #ff5967;
  border-radius:5px;background:linear-gradient(180deg,#ff3546,#d71628);
  font-size:8px;font-weight:950;
}
.modal-secondary{
  width:100%;height:32px;margin-top:7px;
  border:1px solid #46535f;border-radius:5px;
  background:#111820;font-size:8px;font-weight:900;
}

.profile-popup{max-width:340px}
.profile-head{display:flex;align-items:center;gap:10px}
.profile-avatar{
  width:62px;height:62px;display:flex;align-items:center;justify-content:center;
  flex:none;background:linear-gradient(145deg,#3a4652,#111820);
  border:1px solid #687580;border-radius:7px;font-size:30px;
}
.profile-label{font-size:6px;letter-spacing:1.6px;color:#71808d;font-weight:950}
.profile-name{font-size:17px;font-weight:950;margin-top:4px}
.profile-level{font-size:8px;color:var(--red2);font-weight:900;margin-top:4px}
.profile-divider{height:1px;background:#34414d;margin:12px 0 7px}
.profile-stat{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 1px;font-size:8px;color:var(--muted);
}
.profile-stat b{font-size:13px;color:var(--green)}
.profile-stat:nth-of-type(2) b{color:var(--blue)}
.profile-progress{
  height:7px;background:#05070b;border:1px solid #2b3540;
  border-radius:2px;overflow:hidden;margin-top:2px;
}
.profile-progress div{
  height:100%;width:0;background:linear-gradient(90deg,#ff2638,#ff5967);
}
@media(max-width:430px){
  .portal{padding:7px 8px 8px;gap:5px}
  .top-controls{height:34px}.top-btn{height:33px;min-width:65px;font-size:7px}
  .brand{height:84px}.brand-mark{font-size:32px;line-height:29px}
  .brand-mark b{font-size:15px}.brand-sub{font-size:7px;padding:4px 10px}
  .account-chat{height:70px;gap:5px}
  .account-card,.chat-card{padding:6px 8px}
  .account-avatar{width:38px;height:38px;font-size:20px}
  .account-name{font-size:9px}.account-balance{font-size:8px}
  .chat-title{font-size:6.8px}.chat-line{font-size:5.7px;line-height:11px}
  .menu-grid{gap:5px}
  .menu-tile{padding:7px 31px 7px 7px}
  .tile-icon{font-size:20px;width:28px}
  .tile-title{font-size:8px}.tile-desc{font-size:5.5px;margin-top:3px}
  .menu-tile .card-arrow{width:21px;height:24px;font-size:18px}
  .footer{font-size:5px}
}
@media(max-height:700px){
  .brand{height:72px}.account-chat{height:64px}
  .menu-tile{padding-top:6px;padding-bottom:6px}
}
</style>
</head>

<body>
<div class="portal">

  <div class="top-controls">
    <button class="top-btn" onclick="Core.toggleTheme();Core.applyTheme()">🎨 <span data-i18n="theme">ТЕМА</span></button>
    <button class="top-btn" onclick="Core.toggleSound()">🔊 <span data-i18n="sound">ЗВУК</span></button>
    <button class="top-btn" onclick="Core.toggleLang();updateUI()">🌐 <span id="langCode">RU</span></button>
  </div>

  <div class="brand">
    <div class="brand-mark">FREE<span>zzz</span><b>Games</b></div>
    <div class="brand-sub" data-i18n="gameTitle">СИМУЛЯТОР БЛОГЕРА</div>
  </div>

  <div class="account-chat">
    <div class="account-card" onclick="openProfileCard()" role="button" tabindex="0">
      <div class="account-avatar" id="accountAvatar">👨</div>
      <div class="account-info">
        <div class="account-name" id="playerName">Blogger</div>
        <div class="account-balance" id="playerBalance">0.00 €</div>
        <div class="account-level">LV <b id="playerLevel">1</b></div>
      </div>
      <div class="card-arrow">›</div>
    </div>

    <div class="chat-card" onclick="openChatModal()" role="button" tabindex="0">
      <div class="chat-title">💬 <span data-i18n="chatTitle">ГЛОБАЛЬНЫЙ ЧАТ</span></div>
      <div class="chat-line">Alex: Кто на каком тренде сейчас?</div>
      <div class="chat-line">ARTB_Leader: Качайте холдинг!</div>
      <div class="card-arrow">›</div>
    </div>
  </div>

  <div class="menu-grid">

    <button class="menu-tile primary" onclick="openGame()">
      <div class="tile-icon">🎬</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="studio">🔴 ВОЙТИ В СТУДИЮ</div>
        <div class="tile-desc" data-i18n="studioDesc">Создавай и публикуй контент</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="menu-tile" onclick="openTransferModal()">
      <div class="tile-icon">🤝</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="transfer">Перевод спонсору</div>
        <div class="tile-desc" data-i18n="transferDesc">Бренды и спонсоры</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="menu-tile" onclick="openCollection()">
      <div class="tile-icon">🛒</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="shop">Магазин и Холдинг</div>
        <div class="tile-desc" data-i18n="shopDesc">Оборудование и развитие</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="menu-tile" onclick="openAvatar()">
      <div class="tile-icon">🎨</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="avatar">Кастомизация</div>
        <div class="tile-desc" data-i18n="avatarDesc">Аватар и студия</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="menu-tile" onclick="openGallery()">
      <div class="tile-icon">🏆</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="gallery">Награды</div>
        <div class="tile-desc" data-i18n="galleryDesc">Достижения и кнопки</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="menu-tile" onclick="openArcade()">
      <div class="tile-icon">🕹️</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="arcade">Аркада</div>
        <div class="tile-desc" data-i18n="arcadeDesc">Мини-игры и рекорды</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

    <button class="menu-tile" onclick="openLeaderboard()">
      <div class="tile-icon">📊</div>
      <div class="tile-copy">
        <div class="tile-title" data-i18n="rank">Таблица лидеров</div>
        <div class="tile-desc" data-i18n="rankDesc">Рейтинг игроков</div>
      </div>
      <div class="card-arrow">›</div>
    </button>

  </div>

  <div class="footer">FREEzzzGames • Симулятор Блогера v5.8</div>
</div>

<!-- PROFILE -->
<div class="modal-overlay" id="profileModal" onclick="closeModal(event,'profileModal')">
  <div class="modal profile-popup" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title">👤 <span data-i18n="profile">ПРОФИЛЬ БЛОГЕРА</span></div>
      <button class="modal-close" onclick="closeModal(null,'profileModal')">×</button>
    </div>

    <div class="profile-head">
      <div class="profile-avatar" id="profileCardAvatar">👨</div>
      <div>
        <div class="profile-label">FREEzzzGAMES / CREATOR</div>
        <div class="profile-name" id="profileCardName">Blogger</div>
        <div class="profile-level" id="profileCardLevel">LV 1</div>
      </div>
    </div>

    <div class="profile-divider"></div>

    <div class="profile-stat">
      <span>💰 <span data-i18n="balance">Баланс</span></span>
      <b id="profileCardMoney">0.00 €</b>
    </div>
    <div class="profile-stat">
      <span>⭐ XP</span>
      <b id="profileCardXP">0 / 100</b>
    </div>
    <div class="profile-progress"><div id="profileCardProgress"></div></div>
  </div>
</div>

<!-- CHAT -->
<div class="modal-overlay" id="chatModal" onclick="closeModal(event,'chatModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title" data-i18n="chatModal">💬 ГЛОБАЛЬНЫЙ ЧАТ</div>
      <button class="modal-close" onclick="closeModal(null,'chatModal')">×</button>
    </div>
    <div class="chat-feed" id="chatFeed"></div>
    <div class="modal-row">
      <input class="modal-input" id="chatInput" data-i18n-placeholder="chatPlaceholder" placeholder="Сообщение...">
      <button class="modal-action" onclick="sendChatMessage()">➤</button>
    </div>
  </div>
</div>

<!-- SPONSOR TRANSFER -->
<div class="modal-overlay" id="transferModal" onclick="closeModal(event,'transferModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-title" data-i18n="transferTitle">🤝 ПЕРЕВОД СПОНСОРУ</div>
      <button class="modal-close" onclick="closeModal(null,'transferModal')">×</button>
    </div>

    <input class="modal-input" id="sponsorName" style="width:100%;margin-bottom:6px"
           data-i18n-placeholder="sponsorPlaceholder" placeholder="Никнейм спонсора (@username)">
    <input class="modal-input" id="transferAmount" style="width:100%"
           type="number" min="0" step="0.01"
           data-i18n-placeholder="amountPlaceholder" placeholder="Сумма в €">

    <button class="modal-action" style="width:100%;margin-top:7px"
            onclick="executeTransfer()" data-i18n="send">ОТПРАВИТЬ</button>
  </div>
</div>

let chatMessages=[
  {user:"Alex",text:"Кто на каком тренде сейчас?"},
  {user:"ARTB_Leader",text:"Качайте холдинг!"}
];

function go(file){window.location.href=file}
function openGame(){go("game.html")}
function openCollection(){go("collection.html")}
function openAvatar(){go("avatar.html")}
function openGallery(){go("gallery.html")}
function openArcade(){go("arcade.html")}
function openLeaderboard(){go("leaderboard.html")}

function getState(){
  try{
    const raw=localStorage.getItem("tube_empire_state_v1");
    if(!raw)return null;
    const s=JSON.parse(raw);
    return s&&s.player?s:null;
  }catch(e){return null}
}

function getAvatar(){
  try{
    const a=JSON.parse(localStorage.getItem("tube_empire_avatar_config")||"{}");
    const gender=["👦","👧"],head=["👤","🧢","🎧","🕶️","👑"],
          torso=["👕","🧥","👔","🥼","👚"];
    return (gender[a.gender??0]||gender[0])+
           (head[a.head??0]||head[0])+
           (torso[a.torso??0]||torso[0]);
  }catch(e){
    return "👨";
  }
}

function profile(){
  const s=getState();
  const p=s?.player||{};
  const xp=Number(s?.channel?.xp)||0;
  const name=p.name||Core.getUserName("Блогер");
  const money=Number(p.money);
  return {
    name,
    money:Number.isFinite(money)?money:Number(Core.getMoney())||0,
    xp,
    level:Math.max(1,Math.floor(xp/100)+1),
    avatar:getAvatar()
  };
}

function money(v){
  return Number(v||0).toLocaleString("de-DE",{
    minimumFractionDigits:2,maximumFractionDigits:2
  })+" €";
}

function renderProfile(){
  const p=profile();
  const xpInLevel=p.xp%100;
  const set=(id,v)=>{
    const el=document.getElementById(id);
    if(el)el.textContent=v;
  };

  set("playerName",p.name);
  set("playerBalance",money(p.money));
  set("playerLevel",p.level);
  set("profileCardName",p.name);
  set("profileCardMoney",money(p.money));
  set("profileCardLevel","LV "+p.level);
  set("profileCardXP",xpInLevel+" / 100");

  const a=document.getElementById("accountAvatar");
  const b=document.getElementById("profileCardAvatar");
  const bar=document.getElementById("profileCardProgress");
  if(a)a.textContent=p.avatar;
  if(b)b.textContent=p.avatar;
  if(bar)bar.style.width=xpInLevel+"%";
}

function openProfileCard(){
  renderProfile();
  document.getElementById("profileModal").classList.add("active");
  if(Core.playSound)Core.playSound("modal");
}

function openChatModal(){
  renderChat();
  document.getElementById("chatModal").classList.add("active");
  if(Core.playSound)Core.playSound("modal");
}

function openTransferModal(){
  document.getElementById("transferAmount").value="";
  document.getElementById("sponsorName").value="";
  document.getElementById("transferModal").classList.add("active");
  if(Core.playSound)Core.playSound("modal");
}

function closeModal(event,id){
  if(event&&event.target!==event.currentTarget)return;
  const el=document.getElementById(id);
  if(el)el.classList.remove("active");
}

function renderChat(){
  const el=document.getElementById("chatFeed");
  if(!el)return;
  el.innerHTML=chatMessages.map(m=>
    `<span><b>${escapeHtml(m.user)}:</b> ${escapeHtml(m.text)}</span>`
  ).join("");
  el.scrollTop=el.scrollHeight;
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[ch]));
}

function sendChatMessage(){
  const input=document.getElementById("chatInput");
  const text=(input?.value||"").trim();
  if(!text)return;
  chatMessages.push({
    user:Core.getUserName("Streamer"),
    text:text
  });
  if(input)input.value="";
  renderChat();
  if(Core.playSound)Core.playSound("click");
}

function executeTransfer(){
  const amount=Number(document.getElementById("transferAmount").value);
  const t=langMap[Core.getLang()]||langMap.ru;

  if(!Number.isFinite(amount)||amount<=0||Core.getMoney()<amount){
    alert(t.transferError);
    if(Core.playSound)Core.playSound("error");
    return;
  }

  Core.setMoney(Core.getMoney()-amount);
  if(Core.playSound)Core.playSound("cash");

  alert(t.transferOk.replace("{amount}",amount.toLocaleString()));
  closeModal(null,"transferModal");
  renderProfile();
}

function updateUI(){
  const lang=Core.getLang();
  const t=langMap[lang]||langMap.ru;

  document.documentElement.lang=lang;
  const langCode=document.getElementById("langCode");
  if(langCode)langCode.textContent=lang==="ru"?"RU":lang==="de"?"DE":"EN";

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key=el.getAttribute("data-i18n");
    if(t[key]!=null)el.textContent=t[key];
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
    const key=el.getAttribute("data-i18n-placeholder");
    if(t[key]!=null)el.placeholder=t[key];
  });

  Core.applyTheme(Core.getTheme());
  renderProfile();
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    ["profileModal","chatModal","transferModal"].forEach(id=>closeModal(null,id));
  }
});

document.addEventListener("DOMContentLoaded",()=>{
  updateUI();
  renderChat();
  renderProfile();
  setInterval(renderProfile,1000);
});
</script>
</body>
</html>
