<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tube Empire — Награды</title><script src="core.js"></script><style>
:root{--bg:#05070b;--p:#111820;--p2:#18222c;--line:#3d4b57;--red:#ff2638;--gold:#ffd54a;--green:#39e879;--text:#f5f7fa;--muted:#8995a4}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{display:flex;justify-content:center}.page{width:100%;max-width:620px;height:100dvh;padding:8px;display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,#090e14,#05070b)}.head{height:42px;display:flex;align-items:center;gap:6px}.home{width:44px;height:38px;border-radius:6px;border:1px solid #52606c;background:#17212a;color:#fff;font-size:19px}.title{flex:1;text-align:center;font-size:11px;font-weight:950;color:var(--gold)}.summary{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--p);text-align:center}.summary b{font-size:18px}.summary small{display:block;color:var(--muted);font-size:7px;margin-top:3px}.list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px}.item{position:relative;padding:9px 34px 9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--p2)}.item.done{border-color:#2e9e60;background:#102019}.item b{display:block;font-size:9px}.item span{display:block;margin-top:3px;color:var(--muted);font-size:7px}.check{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--green)}.lock{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
</style></head><body><main class="page"><div class="head"><button class="home" onclick="location.href='index.html'" aria-label="Menu">⌂</button><div class="title" id="title">🏆 НАГРАДЫ</div></div><div class="summary"><b id="count">0 / 8</b><small id="summary">Разблокировано достижений</small></div><div class="list" id="list"></div></main><script>
const T={ru:{title:'🏆 НАГРАДЫ',summary:'Разблокировано достижений',items:[['Первый канал','Опубликовать первое видео'],['Первый доход','Заработать 100 €'],['1K просмотров','Набрать 1 000 просмотров'],['100 подписчиков','Набрать 100 подписчиков'],['Уровень 5','Достичь 5 уровня'],['Уровень 10','Достичь 10 уровня'],['Вирусный автор','Получить вирусный ролик'],['Большая студия','Улучшить студию 5 раз']]},de:{title:'🏆 ERFOLGE',summary:'Freigeschaltete Erfolge',items:[['Erster Kanal','Erstes Video veröffentlichen'],['Erstes Einkommen','100 € verdienen'],['1K Aufrufe','1.000 Aufrufe erreichen'],['100 Abonnenten','100 Abonnenten erreichen'],['Level 5','Level 5 erreichen'],['Level 10','Level 10 erreichen'],['Viral-Autor','Virales Video erhalten'],['Großes Studio','Studio 5-mal verbessern']]},en:{title:'🏆 ACHIEVEMENTS',summary:'Achievements unlocked',items:[['First Channel','Publish your first video'],['First Income','Earn €100'],['1K Views','Reach 1,000 views'],['100 Subscribers','Reach 100 subscribers'],['Level 5','Reach level 5'],['Level 10','Reach level 10'],['Viral Creator','Get a viral video'],['Big Studio','Upgrade the studio 5 times']]}};
function render(){const q=T[Core.getLang()]||T.ru,s=Core.getState(),v=Number(s.channel?.views)||0,sub=Number(s.channel?.subscribers)||0,lev=Number(s.upgrades?.studio)||1,earned=Number(s.player?.totalEarned)||0,h=s.channel?.history||[],done=[v>0,earned>=100,v>=1000,sub>=100,lev>=5,lev>=10,h.some(x=>Number(x.multiplier)>=3),lev>=5];document.getElementById('title').textContent=q.title;document.getElementById('summary').textContent=q.summary;document.getElementById('count').textContent=done.filter(Boolean).length+' / '+q.items.length;document.getElementById('list').innerHTML=q.items.map((x,i)=>`<div class="item ${done[i]?'done':''}"><b>${x[0]}</b><span>${x[1]}</span><i class="${done[i]?'check':'lock'}">${done[i]?'✓':'🔒'}</i></div>`).join('')}document.addEventListener('DOMContentLoaded',render);setInterval(render,1000);
</script></body></html>
