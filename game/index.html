<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ORC TRAIL — BlogSim WebGL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101914;color:#f2f1e8;font:14px system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#title{position:absolute;top:12px;left:12px;font-weight:900;letter-spacing:2px}#task{position:absolute;top:43px;left:12px;background:#09100ddd;padding:8px;border:1px solid #80946a;border-radius:7px;font-size:12px}#health{position:absolute;left:12px;bottom:16px;width:190px;height:9px;background:#222;border:1px solid #ddd8}#hp{height:100%;width:100%;background:#c84a3d}#msg{position:absolute;top:17%;left:50%;transform:translateX(-50%);font-weight:900;font-size:24px;color:#f3d78b;text-align:center;white-space:pre-line}#start{position:fixed;inset:0;display:grid;place-items:center;background:#07100cbb;z-index:4;padding:20px}#card{max-width:390px;padding:24px;text-align:center;background:#101b14;border:1px solid #91a77b;border-radius:14px}button{border:0;border-radius:8px;padding:14px 18px;background:#c6a65b;font-weight:900}#mobile{position:fixed;bottom:10px;left:8px;right:8px;display:none;justify-content:space-between;pointer-events:none}#mobile div{display:flex;gap:5px}#mobile button{pointer-events:auto;width:46px;height:46px;padding:0;border-radius:50%;background:#111c16dd;color:white;border:1px solid #ffffff55;touch-action:none}#mobile .fire{background:#9d392ddd;width:58px;height:58px}@media(pointer:coarse){#mobile{display:flex}#health{bottom:76px}}
</style></head><body><div id="hud"><div id="title">ORC TRAIL / BLOGSIM WEBGL</div><div id="task">Цель: уничтожить орков<br><span id="left">Осталось: 8</span></div><div id="health"><div id="hp"></div></div><div id="msg"></div></div>
<div id="mobile"><div><button data-k="left">◀</button><button data-k="f">▲</button><button data-k="b">▼</button><button data-k="right">▶</button></div><div><button data-k="tl">↶</button><button data-k="tr">↷</button><button class="fire" data-k="fire">🏹</button></div></div>
<div id="start"><div id="card"><h1>ORC TRAIL</h1><p>3D-экшен от третьего лица. Пройди через лес к орочьему лагерю и уничтожь восемь орков.</p><p>ПК: WASD, мышь, клик. Телефон: экранные кнопки.</p><button id="go">НАЧАТЬ ИГРУ</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db7b7);scene.fog=new THREE.Fog(0x9db7b7,35,145);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9e9e2,0x34412c,2));const sun=new THREE.DirectionalLight(0xffe2b0,2.8);sun.position.set(-25,45,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});const green=material(0x31563a),greens=[material(0x23442d),material(0x386541),material(0x496f42)],wood=material(0x503b29),stone=material(0x676b5a),cloth=material(0x405a42),skin=material(0x91a56e),orcskin=material(0x607a46),orccloth=material(0x493126),red=material(0x8b2d25),metal=material(0x8b8d7e);
function box(parent,x,y,z,a,b,c,m){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,x,y,z,rt,rb,h,m,n=8){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(210,210),green);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const trail=new THREE.Mesh(new THREE.PlaneGeometry(13,100),material(0x75684b));trail.rotation.x=-Math.PI/2;trail.position.set(0,.01,-35);scene.add(trail);
let seed=435;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<155;i++){let x=(rand()-.5)*180,z=(rand()-.5)*180;if(Math.abs(x)<11&&z>-85&&z<15)continue;let h=4+rand()*4; cyl(scene,x,h*.3,z,.3,.4,h*.6,wood,7);let crown=new THREE.Mesh(new THREE.ConeGeometry(1.7+rand()*1.4,h*.8,7),greens[i%3]);crown.position.set(x,h*.85,z);crown.castShadow=true;scene.add(crown)}
for(let i=0;i<35;i++){let r=.6+rand()*1.4,o=new THREE.Mesh(new THREE.DodecahedronGeometry(r),stone);o.position.set((rand()-.5)*170,r*.45,(rand()-.5)*170);o.scale.y=.6;o.castShadow=true;scene.add(o)}
// broken ruin columns
for(let i=0;i<6;i++){cyl(scene,-12,1.3,-27-i*5,.55,.7,2.6,stone,7);cyl(scene,12,1.3,-30-i*5,.55,.7,2.6,stone,7)}
// orc camp fence and tents
for(let i=0;i<15;i++){let x=-14+i*2;box(scene,x,.8,-66,.2,1.6,.25,wood);box(scene,x,.8,-80,.2,1.6,.25,wood)}
for(let z=-79;z<-65;z+=2)for(let x of [-14,14])box(scene,x,.8,z,.25,1.6,.2,wood);
for(let i=0;i<3;i++){let x=-8+i*8,t=new THREE.Mesh(new THREE.ConeGeometry(3,4,4),i===1?red:wood);t.position.set(x,2,-73);t.rotation.y=.78;t.castShadow=true;scene.add(t);box(scene,x+2,2,-68,.1,4,.1,wood);box(scene,x+2.4,3, -68,.8,1,.06,red)}
const player=new THREE.Group();scene.add(player);player.position.set(0,0,24);cyl(player,0,1.25,0,.42,.32,1.2,cloth);cyl(player,0,2.05,0,.3,.32,.42,wood);let head=new THREE.Mesh(new THREE.SphereGeometry(.29,12,10),skin);head.position.y=2.45;player.add(head);cyl(player,-.2,.45,0,.16,.18,.9,wood);cyl(player,.2,.45,0,.16,.18,.9,wood);box(player,-.22,1.35,0,.17,.7,.2,wood);box(player,.22,1.35,0,.17,.7,.2,wood);let bow=new THREE.Mesh(new THREE.TorusGeometry(.42,.035,6,16,Math.PI),material(0xb88d4b));bow.position.set(.48,1.6,.25);bow.rotation.z=Math.PI/2;player.add(bow);
const orcs=[];for(let i=0;i<8;i++){let g=new THREE.Group();scene.add(g);g.position.set(-10+(i%4)*6,0,-66-Math.floor(i/4)*7);cyl(g,0,1.15,0,.45,.38,1.1,orccloth);cyl(g,0,2,0,.34,.35,.45,orcskin);let h=new THREE.Mesh(new THREE.SphereGeometry(.32,10,8),orcskin);h.position.y=2.38;g.add(h);cyl(g,-.2,.45,0,.17,.19,.9,wood);cyl(g,.2,.45,0,.17,.19,.9,wood);box(g,.5,1.3,0,.16,.8,.17,orcskin);box(g,-.5,1.3,0,.16,.8,.17,orcskin);box(g,.6,1.3,.1,.12,.8,.12,metal);g.userData={hp:100,alive:true,attack:rand()+.5};orcs.push(g)}
let keys={},touch={},started=false,dead=false,won=false,hp=100,kills=0,yaw=0,pitch=0,cd=0,toastT=0;function toast(t){document.querySelector('#msg').textContent=t;toastT=2}
const ray=new THREE.Raycaster();function shoot(){if(!started||dead||won||cd>0)return;cd=.3;let origin=player.position.clone().add(new THREE.Vector3(0,1.7,0)),dir=new THREE.Vector3(Math.sin(yaw),Math.sin(pitch),-Math.cos(yaw)).normalize();ray.set(origin,dir);ray.far=65;let targets=[];orcs.forEach(o=>{if(o.userData.alive)targets.push(...o.children.filter(c=>c.isMesh))});let hits=ray.intersectObjects(targets,false);let bolt=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1,5),material(0xffd58a));bolt.position.copy(origin.clone().addScaledVector(dir,1.5));bolt.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);scene.add(bolt);setTimeout(()=>scene.remove(bolt),130);if(hits.length){let obj=hits[0].object;while(obj.parent&&!orcs.includes(obj.parent))obj=obj.parent;let enemy=orcs.find(o=>o===obj||o.children.includes(obj));if(enemy&&enemy.userData.alive){enemy.userData.hp-=50;if(enemy.userData.hp<=0){enemy.userData.alive=false;scene.remove(enemy);kills++;document.querySelector('#left').textContent='Осталось: '+(8-kills);if(kills===8){won=true;toast('ЛАГЕРЬ ОЧИЩЕН!\nПОБЕДА')}else toast('ОРК УБИТ')}else toast('ПОПАДАНИЕ')}}}
function update(dt){if(!started||dead||won)return;let f=(keys.KeyW||keys.ArrowUp||touch.f?1:0)-(keys.KeyS||keys.ArrowDown||touch.b?1:0),s=(keys.KeyD||keys.ArrowRight||touch.right?1:0)-(keys.KeyA||keys.ArrowLeft||touch.left?1:0);if(touch.tl)yaw+=dt*1.7;if(touch.tr)yaw-=dt*1.7;let v=new THREE.Vector3(Math.sin(yaw)*f+Math.cos(yaw)*s,0,-Math.cos(yaw)*f+Math.sin(yaw)*s);if(v.lengthSq()){v.normalize();player.position.addScaledVector(v,dt*(keys.ShiftLeft?9:6));player.rotation.y=yaw}player.position.x=THREE.MathUtils.clamp(player.position.x,-95,95);player.position.z=THREE.MathUtils.clamp(player.position.z,-95,95);cd=Math.max(0,cd-dt);for(let o of orcs){if(!o.userData.alive)continue;o.userData.attack-=dt;let dx=player.position.x-o.position.x,dz=player.position.z-o.position.z,d=Math.hypot(dx,dz);if(d>2){o.position.x+=dx/d*2.3*dt;o.position.z+=dz/d*2.3*dt;o.rotation.y=Math.atan2(dx,-dz)}else if(o.userData.attack<=0){hp-=9;o.userData.attack=1.2;if(hp<=0){hp=0;dead=true;toast('ТЫ ПОГИБ\nОбнови страницу')}}}document.querySelector('#hp').style.width=hp+'%';if(toastT>0&&(toastT-=dt)<=0)document.querySelector('#msg').textContent=''}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);update(dt);let back=new THREE.Vector3(Math.sin(yaw)*7,3.3,Math.cos(yaw)*7);camera.position.copy(player.position).add(back);camera.lookAt(player.position.x,player.position.y+1.6,player.position.z);renderer.render(scene,camera)}loop();
document.querySelector('#go').onclick=()=>{started=true;document.querySelector('#start').style.display='none';toast('Иди к лагерю и стреляй по оркам')};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys[e.code]=false);renderer.domElement.addEventListener('click',()=>{if(started)shoot()});addEventListener('mousemove',e=>{if(e.buttons===1){yaw-=e.movementX*.003;pitch=THREE.MathUtils.clamp(pitch-e.movementY*.002,-.4,.3)}});document.querySelectorAll('#mobile button').forEach(b=>{let k=b.dataset.k;const on=e=>{e.preventDefault();touch[k]=true;if(k==='fire')shoot()},off=e=>{e.preventDefault();touch[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
