<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FREEzzz Arcade</title><script src="core.js"></script><style>
:root{--bg:#05070b;--p:#111820;--p2:#18222c;--line:#3d4b57;--red:#ff2638;--blue:#35b8ff;--green:#39e879;--gold:#ffd54a;--text:#f5f7fa;--muted:#8995a4}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}body{display:flex;justify-content:center}.page{width:100%;max-width:620px;height:100dvh;padding:8px;display:flex;flex-direction:column;gap:7px;background:radial-gradient(circle at 50% 0,#18233a,#05070b 55%)}.head{height:42px;display:flex;align-items:center}.home{width:44px;height:38px;border-radius:6px;border:1px solid #52606c;background:#17212a;color:#fff;font-size:19px}.title{flex:1;text-align:center;font-size:12px;font-weight:950;color:var(--blue)}.hint{font-size:7px;color:var(--muted);text-align:center}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tab{height:38px;border:1px solid var(--line);border-radius:6px;background:#17212a;color:#fff;font-size:8px;font-weight:900}.tab.active{border-color:var(--blue);box-shadow:0 0 12px #35b8ff22}.game{flex:1;min-height:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:#0d141b;display:flex;flex-direction:column}.game h2{font-size:11px;text-align:center;margin:0 0 6px}.stats{text-align:center;color:var(--gold);font-size:8px;margin-bottom:8px}.cards{display:flex;justify-content:center;gap:7px;min-height:76px}.card{width:48px;height:68px;border-radius:7px;background:#f4f5f6;color:#111;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;border:2px solid #fff;box-shadow:0 5px 10px #0008}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{height:42px;border-radius:6px;border:1px solid #52606c;background:#17212a;color:#fff;font-size:9px;font-weight:900}.primary{background:linear-gradient(#ff394a,#c91627);border-color:#ff5967}.message{text-align:center;min-height:30px;margin-top:7px;font-size:8px;color:var(--muted)}.reaction{display:none;align-items:center;justify-content:center;flex:1}.react-btn{width:180px;height:180px;border-radius:50%;border:2px solid var(--blue);background:#101b28;color:#fff;font-size:12px;font-weight:950}.react-btn.go{background:#0d2c1d;border-color:var(--green)}
</style></head><body><main class="page"><div class="head"><button class="home" onclick="location.href='index.html'">⌂</button><div class="title" id="title">🕹️ FREEzzz ARCADE</div></div><div class="hint" id="hint">Мини-игры без ставок. Пассивный доход продолжает работать.</div><div class="tabs"><button class="tab active" id="tab21" onclick="showGame('21')">🃏 21 CHALLENGE</button><button class="tab" id="tabReact" onclick="showGame('react')">⚡ REACTION</button></div><section class="game" id="game21"><h2 id="h21">21 CARD CHALLENGE</h2><div class="stats" id="score21">Очки: 0 • Серия: 0</div><div class="cards" id="cards"></div><div class="message" id="msg21">Набери как можно ближе к 21, не превышая его.</div><div class="controls"><button class="btn primary" id="newBtn" onclick="newRound()">НОВЫЙ РАУНД</button><button class="btn" id="hitBtn" onclick="hit()">ВЗЯТЬ КАРТУ</button><button class="btn" id="standBtn" onclick="stand()">СТОП</button><button class="btn" onclick="resetScore()">СБРОС ОЧКОВ</button></div></section><section class="game reaction" id="gameReact"><h2 id="rh">REACTION TEST</h2><div class="stats" id="rscore">Рекорд: —</div><div class="reaction" style="display:flex"><button class="react-btn" id="reactBtn" onclick="reactTap()">НАЖМИ, КОГДА ПОЯВИТСЯ СИГНАЛ</button></div><div class="message" id="rmsg"></div><button class="btn primary" onclick="startReaction()" id="startReact">СТАРТ</button></section></main><script>
const T={ru:{hint:'Мини-игры без ставок. Пассивный доход продолжает работать.',h21:'21 CARD CHALLENGE',score:'Очки: {s} • Серия: {st}',msg:'Набери как можно ближе к 21, не превышая его.',new:'НОВЫЙ РАУНД',hit:'ВЗЯТЬ КАРТУ',stand:'СТОП',reset:'СБРОС ОЧКОВ',rh:'REACTION TEST',record:'Рекорд: {r}',start:'СТАРТ',wait:'Жди сигнал…',tap:'НАЖМИ!',too:'Перебор! Раунд завершён.',win:'Отличный раунд!',lose:'Раунд завершён.',tie:'Ровно 21!'},de:{hint:'Minispiele ohne Einsätze. Das passive Einkommen läuft weiter.',h21:'21 KARTEN-CHALLENGE',score:'Punkte: {s} • Serie: {st}',msg:'Komme möglichst nah an 21, ohne darüber zu gehen.',new:'NEUE RUNDE',hit:'KARTE ZIEHEN',stand:'STOPP',reset:'PUNKTE RESET',rh:'REACTION TEST',record:'Rekord: {r}',start:'START',wait:'Warte auf das Signal…',tap:'JETZT!',too:'Über 21! Runde beendet.',win:'Starke Runde!',lose:'Runde beendet.',tie:'Genau 21!'},en:{hint:'Mini-games with no stakes. Passive income keeps running.',h21:'21 CARD CHALLENGE',score:'Score: {s} • Streak: {st}',msg:'Get as close to 21 as possible without going over.',new:'NEW ROUND',hit:'DRAW CARD',stand:'STAND',reset:'RESET SCORE',rh:'REACTION TEST',record:'Record: {r}',start:'START',wait:'Wait for the signal…',tap:'TAP!',too:'Over 21! Round ended.',win:'Great round!',lose:'Round ended.',tie:'Exactly 21!'}};
let score=Number(localStorage.getItem('arcade_score')||0),streak=0,hand=[],active=false;let rBest=Number(localStorage.getItem('reaction_best')||0),rTimer=null,rReady=false,rStart=0;
function q(){return T[Core.getLang()]||T.ru}function showGame(x){document.getElementById('game21').style.display=x==='21'?'flex':'none';document.getElementById('gameReact').style.display=x==='react'?'flex':'none';document.getElementById('tab21').classList.toggle('active',x==='21');document.getElementById('tabReact').classList.toggle('active',x==='react');}
function draw(){return Math.floor(Math.random()*13)+1}function total(){return hand.reduce((a,b)=>a+Math.min(b,10),0)}function newRound(){hand=[draw(),draw()];active=true;document.getElementById('msg21').textContent=q().msg;renderCards()}function renderCards(){document.getElementById('cards').innerHTML=hand.map(v=>`<div class="card">${v===1?'A':v}</div>`).join('');document.getElementById('score21').textContent=q().score.replace('{s}',score).replace('{st}',streak);document.getElementById('hitBtn').disabled=!active;document.getElementById('standBtn').disabled=!active}
function hit(){if(!active)return;hand.push(draw());if(total()>21){active=false;streak=0;document.getElementById('msg21').textContent=q().too}renderCards()}function stand(){if(!active)return;active=false;const v=total();if(v===21){score+=3;streak++;document.getElementById('msg21').textContent=q().tie}else if(v>=18){score+=2;streak++;document.getElementById('msg21').textContent=q().win}else{score+=1;streak++;document.getElementById('msg21').textContent=q().lose}localStorage.setItem('arcade_score',score);renderCards()}function resetScore(){score=0;streak=0;localStorage.setItem('arcade_score','0');newRound()}
function startReaction(){clearTimeout(rTimer);rReady=false;rStart=0;const b=document.getElementById('reactBtn');b.classList.remove('go');b.textContent=q().wait;document.getElementById('rmsg').textContent='';rTimer=setTimeout(()=>{rReady=true;rStart=performance.now();b.classList.add('go');b.textContent=q().tap},700+Math.random()*2200)}function reactTap(){if(!rReady){document.getElementById('rmsg').textContent=q().wait;return}const ms=Math.round(performance.now()-rStart);rReady=false;const b=document.getElementById('reactBtn');b.classList.remove('go');b.textContent='✓ '+ms+' ms';if(!rBest||ms<rBest){rBest=ms;localStorage.setItem('reaction_best',String(rBest))}document.getElementById('rmsg').textContent='';document.getElementById('rscore').textContent=q().record.replace('{r}',rBest+' ms')}function render(){const x=q();document.getElementById('hint').textContent=x.hint;document.getElementById('h21').textContent=x.h21;document.getElementById('newBtn').textContent=x.new;document.getElementById('hitBtn').textContent=x.hit;document.getElementById('standBtn').textContent=x.stand;document.querySelector('#game21 .controls button:last-child').textContent=x.reset;document.getElementById('rh').textContent=x.rh;document.getElementById('startReact').textContent=x.start;document.getElementById('rscore').textContent=x.record.replace('{r}',rBest?rBest+' ms':'—');renderCards()}document.addEventListener('DOMContentLoaded',()=>{render();newRound()});setInterval(render,1000);
</script></body></html>
