<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FREEzzzGames — Таблица лидеров</title>
<script src="core.js"></script>

<style>
:root{
  --bg:#080a0d;
  --panel:#11151a;
  --panel2:#171c22;
  --panel3:#0d1014;
  --line:#343c45;
  --line-soft:#252c33;
  --txt:#f1f4f7;
  --sub:#8d98a3;
  --acc:#ff3348;
  --acc2:#ff5969;
  --green:#38d979;
  --gold:#ffd21f;
  --silver:#c9d0d7;
  --bronze:#cd8b4b;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% -15%,rgba(255,51,72,.12),transparent 38%),
    linear-gradient(180deg,#0b0d10 0%,#07090c 100%);
  color:var(--txt);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  padding:8px;
}

.app{
  width:100%;
  height:100%;
  max-width:430px;
  position:relative;
  display:flex;
  flex-direction:column;
  padding:10px;
  background:
    linear-gradient(180deg,rgba(25,29,34,.98),rgba(10,13,17,.99));
  border:1px solid #3c444d;
  border-radius:12px;
  box-shadow:
    inset 0 1px rgba(255,255,255,.055),
    0 12px 35px rgba(0,0,0,.55);
}

.app:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:12px;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.025),
    transparent 25%,
    transparent 75%,
    rgba(255,255,255,.015)
  );
}

.topbar{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:42px;
  padding:7px;
  background:linear-gradient(180deg,#1d2329,#13181d);
  border:1px solid #3b444d;
  border-radius:8px;
  box-shadow:inset 0 1px rgba(255,255,255,.045);
}

.back{
  flex:0 0 auto;
  height:27px;
  padding:0 10px;
  border:1px solid #4a535d;
  border-radius:6px;
  background:linear-gradient(180deg,#252c33,#171c21);
  color:#dfe4e8;
  font-size:9px;
  font-weight:900;
  letter-spacing:.4px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  box-shadow:inset 0 1px rgba(255,255,255,.05);
}

.back:active{transform:translateY(1px)}

.top-title{
  flex:1;
  min-width:0;
  text-align:center;
  color:#e9edf1;
  font-size:11px;
  font-weight:950;
  letter-spacing:.8px;
  text-transform:uppercase;
}

.top-status{
  width:8px;
  height:8px;
  flex:0 0 8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px rgba(56,217,121,.55);
}

.hero{
  position:relative;
  z-index:1;
  margin-top:8px;
  padding:13px 10px 11px;
  text-align:center;
  background:
    linear-gradient(180deg,rgba(30,35,41,.98),rgba(18,22,27,.98));
  border:1px solid #3a434c;
  border-radius:8px;
  box-shadow:inset 0 1px rgba(255,255,255,.04);
}

.hero-title{
  color:#fff;
  font-size:15px;
  line-height:1.1;
  font-weight:950;
  letter-spacing:.8px;
}

.hero-title span{color:var(--acc)}

.hero-sub{
  margin-top:5px;
  color:var(--sub);
  font-size:8px;
  font-weight:700;
  letter-spacing:.45px;
  text-transform:uppercase;
}

.divider{
  height:1px;
  margin:9px 0 7px;
  background:linear-gradient(90deg,transparent,#3d464f,transparent);
}

.columns{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:8px;
  align-items:center;
  color:#69737d;
  font-size:7px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
  padding:0 9px 4px;
}

.columns span:last-child{text-align:right}

.list{
  position:relative;
  z-index:1;
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:2px 2px 3px;
  scrollbar-width:thin;
  scrollbar-color:#3b444d transparent;
}

.list::-webkit-scrollbar{width:4px}
.list::-webkit-scrollbar-thumb{
  background:#3b444d;
  border-radius:5px;
}

.row{
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:8px;
  align-items:center;
  min-height:48px;
  margin-bottom:5px;
  padding:6px 9px;
  background:linear-gradient(180deg,#181e24,#12171c);
  border:1px solid #303840;
  border-radius:7px;
  box-shadow:inset 0 1px rgba(255,255,255,.025);
}

.row.player{
  border-color:var(--acc);
  background:
    linear-gradient(90deg,rgba(255,51,72,.11),transparent 70%),
    linear-gradient(180deg,#1d2025,#14181d);
  box-shadow:
    inset 3px 0 var(--acc),
    inset 0 1px rgba(255,255,255,.04),
    0 0 12px rgba(255,51,72,.08);
}

.rank{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:34px;
  height:27px;
  border:1px solid #39424b;
  border-radius:5px;
  background:#0d1115;
  color:#7f8993;
  font-size:10px;
  font-weight:950;
}

.rank.first{
  color:var(--gold);
  border-color:rgba(255,210,31,.55);
}
.rank.second{
  color:var(--silver);
  border-color:rgba(201,208,215,.45);
}
.rank.third{
  color:var(--bronze);
  border-color:rgba(205,139,75,.5);
}

.person{
  min-width:0;
}

.name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#eef1f4;
  font-size:10px;
  font-weight:900;
}

.you{
  display:inline-block;
  margin-left:5px;
  padding:2px 4px;
  border:1px solid rgba(255,51,72,.45);
  border-radius:3px;
  color:#ff7180;
  font-size:6px;
  letter-spacing:.5px;
  vertical-align:middle;
}

.meta{
  margin-top:3px;
  color:#68737d;
  font-size:7px;
}

.score{
  color:#dfe5e9;
  font-size:10px;
  font-weight:950;
  white-space:nowrap;
  text-align:right;
}

.player .score{color:var(--acc2)}

.footer{
  position:relative;
  z-index:1;
  margin-top:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 9px;
  background:#0d1115;
  border:1px solid #2d353d;
  border-radius:7px;
  color:#69747e;
  font-size:7px;
  font-weight:800;
}

.live{
  color:var(--green);
  letter-spacing:.4px;
}

.timer{
  text-align:right;
}

@media(max-height:560px){
  .app{padding:7px}
  .hero{padding:9px 8px}
  .hero-title{font-size:13px}
  .row{min-height:42px;padding:5px 8px}
  .topbar{min-height:37px}
}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <a href="index.html" class="back" id="menuBtnTxt">← МЕНЮ</a>
    <div class="top-title" id="headerTitle">ТАБЛИЦА ЛИДЕРОВ</div>
    <div class="top-status"></div>
  </div>

  <div class="hero">
    <div class="hero-title">
      <span>FREEzzz</span> // LEADERBOARD
    </div>
    <div class="hero-sub" id="mainSubTitle">
      Глобальный рейтинг каналов
    </div>
    <div class="divider"></div>
    <div class="columns">
      <span>#</span>
      <span>КАНАЛ</span>
      <span>КАПИТАЛ</span>
    </div>
  </div>

  <div class="list" id="leaderboardList"></div>

  <div class="footer">
    <div class="live">● LIVE RANKING</div>
    <div class="timer" id="timerTxt">Обновление через: 60 сек.</div>
  </div>

</div>

<script>
const langData = {
  ru:{
    menu:"← МЕНЮ",
    title:"ТАБЛИЦА ЛИДЕРОВ",
    sub:"Глобальный рейтинг каналов",
    timer:"Обновление через: ",
    sec:" сек.",
    you:"ВЫ"
  },
  de:{
    menu:"← MENÜ",
    title:"RANGLISTE",
    sub:"Globales Kanal-Ranking",
    timer:"Update in: ",
    sec:" Sek.",
    you:"DU"
  },
  en:{
    menu:"← MENU",
    title:"LEADERBOARD",
    sub:"Global channel ranking",
    timer:"Update in: ",
    sec:" sec.",
    you:"YOU"
  }
};

let competitors=[
  {name:"🔴 MrBeast",baseScore:45000000,growth:120000},
  {name:"🎮 PewDiePie",baseScore:28000000,growth:95000},
  {name:"🎵 T-Series",baseScore:18500000,growth:70000},
  {name:"🎬 Vlad and Niki",baseScore:9500000,growth:45000},
  {name:"⚽ Real Madrid",baseScore:4200000,growth:25000},
  {name:"🎧 Marshmello",baseScore:2100000,growth:15000},
  {name:"🛹 Ryan Kaji",baseScore:980000,growth:8000},
  {name:"🔥 Dude Perfect",baseScore:450000,growth:4000},
  {name:"🎤 Ed Sheeran",baseScore:180000,growth:1800}
];

let countdown=60;

function esc(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function updateLeaderboardUI(){
  const lang=Core.getLang();
  const t=langData[lang]||langData.ru;
  const money=Core.getMoney();

  const userName=Core.getUserName("Streamer");
  const playerName=`${t.you} — ${userName}`;

  document.getElementById("menuBtnTxt").textContent=t.menu;
  document.getElementById("headerTitle").textContent=t.title;
  document.getElementById("mainSubTitle").textContent=t.sub;

  const list=[
    {
      name:playerName,
      score:money,
      isPlayer:true
    }
  ];

  competitors.forEach(c=>{
    c.baseScore+=Math.floor(c.growth*(Math.random()*0.4+0.8));
    list.push({
      name:c.name,
      score:c.baseScore,
      isPlayer:false
    });
  });

  list.sort((a,b)=>b.score-a.score);

  let html="";

  list.slice(0,10).forEach((p,index)=>{
    const rank=index+1;

    let rankClass="";
    if(rank===1) rankClass="first";
    if(rank===2) rankClass="second";
    if(rank===3) rankClass="third";

    const rankText=
      rank===1 ? "👑 1" :
      rank===2 ? "🥈 2" :
      rank===3 ? "🥉 3" :
      `#${rank}`;

    html+=`
      <div class="row ${p.isPlayer?"player":""}">
        <div class="rank ${rankClass}">${rankText}</div>

        <div class="person">
          <div class="name">
            ${esc(p.name)}
            ${p.isPlayer?`<span class="you">${t.you}</span>`:""}
          </div>
          <div class="meta">
            ${p.isPlayer?"PERSONAL CHANNEL":"GLOBAL CHANNEL"}
          </div>
        </div>

        <div class="score">
          🪙 ${Number(p.score).toLocaleString("de-DE",{
            maximumFractionDigits:0
          })}
        </div>
      </div>
    `;
  });

  document.getElementById("leaderboardList").innerHTML=html;
}

setInterval(()=>{
  countdown--;

  const lang=Core.getLang();
  const t=langData[lang]||langData.ru;

  const timer=document.getElementById("timerTxt");
  if(timer){
    timer.textContent=t.timer+countdown+t.sec;
  }

  if(countdown<=0){
    countdown=60;
    updateLeaderboardUI();
  }
},1000);

document.addEventListener("DOMContentLoaded",()=>{
  updateLeaderboardUI();
});
</script>

</body>
</html>
